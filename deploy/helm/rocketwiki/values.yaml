# RocketWiki Helm values (design.md §15, milestone 9).
#
# Reading order matters less than one rule: everything external stays
# external. SQL Server, Keycloak, and the S3 store are consumed by connection
# string / URL, never run by this chart — design.md §17 calls the database
# outside the cluster the lower-risk default, and §15 says production
# Keycloak and embeddings are existing services inside the network boundary.
#
# NOTHING in this file is a real credential. All secrets arrive by reference
# to a Secret the operator creates out-of-band (see `api.existingSecret`).

# ---------------------------------------------------------------------------
# Images & the air-gapped path (design.md §15 "Air-gapped install")
# ---------------------------------------------------------------------------
global:
  # Registry prefix applied to every image below, e.g. "registry.internal:5000".
  # This is the *registry mirror* half of §15's offline story: push the two
  # RocketWiki images to the in-network mirror and set this one value. Leave
  # "" to use image names exactly as written (which is also correct for the
  # *tarball* half — images preloaded with `k3s ctr images import` are found
  # by their original name, no registry involved; pair that with
  # pullPolicy: Never below).
  imageRegistry: ""

# Names of docker-registry Secrets (operator-created) for pulling from an
# authenticated mirror. Empty on a mirror with anonymous pull or with
# preloaded tarballs.
imagePullSecrets: []
#  - name: internal-registry-cred

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
api:
  image:
    repository: rocketwiki/api # built by Dockerfile.api at the repo root
    tag: "0.1.0"
    # IfNotPresent works for both offline paths (a preloaded image is
    # "present"). Set "Never" on a fully air-gapped node to make any pull
    # attempt an immediate, visible error instead of a hanging ImagePullBackOff
    # against a registry that doesn't exist.
    pullPolicy: IfNotPresent

  # HARD LIMIT — 1 is the only supported value, enforced twice: by
  # values.schema.json and by a template guard in api-deployment.yaml.
  # design.md §15: SignalR presence groups and notification fan-out are
  # per-process, in-memory state (RealtimeConnectionRegistry is a singleton);
  # at >1 replica they silently fragment unless a Redis backplane is added,
  # and sticky sessions alone do not fix fan-out. §15 is explicit that
  # single-replica is a legitimate production shape for a wiki — scaling out
  # is a deliberate future decision (backplane + this guard removed), not a
  # knob to turn here.
  replicaCount: 1

  # The Secret (operator-created, NEVER templated by this chart) injected
  # wholesale via envFrom. Keys are .NET configuration env-var names, so the
  # Secret *is* the sensitive half of the app's configuration:
  #
  #   ConnectionStrings__rocketwiki   SQL Server connection string (external
  #                                   server — §17's lower-risk default; this
  #                                   chart does not run SQL Server, period)
  #   Keycloak__Authority             e.g. https://keycloak.internal/realms/rocketwiki
  #   Keycloak__Audience              e.g. rocketwiki-api
  #   FileStorage__S3__AccessKey      S3/MinIO access key
  #   FileStorage__S3__SecretKey      S3/MinIO secret key
  #
  # Optional AI/integration endpoints. Each is fail-closed: absent means the
  # feature is not registered at all, so a deployment that omits one gets a
  # silently feature-less install rather than an error. They are listed here
  # because "reachable only via api.extraEnv, undocumented" is the same thing as
  # not shipping them.
  #   ConnectionStrings__embeddings   semantic search (§9.2). Without it, search is
  #                                   keyword-only — structurally, by design.
  #   ConnectionStrings__assistant    the askWiki field (§9.5). Without it AND
  #   Ai__ChatModel                   Ai__ChatModel, askWiki answers NOT_CONFIGURED.
  #   GitLab__BaseUrl                 GitLab integration (§18). Absent = off.
  #
  # Optional, only with api.fileStorage.provider=SqlServer:
  #   FileStorage__SqlServer__ConnectionString
  #                                   blobs in a SEPARATE database. Omit it and
  #                                   they share ConnectionStrings__rocketwiki,
  #                                   which is the usual reason to pick that
  #                                   provider (one backup covers both).
  #
  # Authority/audience are identifiers rather than credentials, but they live
  # here with the credentials so one Secret fully pins "which environment is
  # this", and a values file can be shared between networks without editing.
  # deploy/README.md has the exact `kubectl create secret` incantation.
  existingSecret: rocketwiki-api

  service:
    # ClusterIP only — nothing reaches the API except the ingress and the web
    # pod's nginx proxy; there is no reason to expose it wider.
    port: 8080

  # ASPNETCORE_ENVIRONMENT. Must stay "Production" (or "Staging") in any real
  # deployment: Development flips RequireHttpsMetadata off for the Keycloak
  # authority and turns on detailed GraphQL/SignalR error surfaces
  # (Program.cs). Never set "Development" to get /health endpoints — the
  # config-gated opt-in wired by probes.mode "http" (below) enables exactly
  # those endpoints without any of that collateral.
  aspnetcoreEnvironment: Production

  # design.md §12: instance identity for low/high sync (native vs replica
  # spaces). **Change this on any instance that takes part in sync.**
  #
  # It used to default to "", which omitted the env var entirely and let the
  # app's own "standalone" fallback apply. Two things were wrong with that, and
  # only one of them was the value: a low/high pair installed with defaults both
  # called themselves "standalone", so every imported space satisfied
  # OriginInstanceId == localInstanceId, Space.IsReplicaOf answered false, and
  # every mirrored space was WRITABLE on the high side — a silent fail-OPEN on
  # the invariant one-way sync rests on. Nothing failed at deploy time, and
  # nothing in the rendered manifest even showed the identity.
  #
  # The default is now explicit rather than implied, so `Instance__Id` always
  # appears in the rendered Deployment and is visible in a diff, and
  # values.schema.json refuses an empty string so it cannot be blanked back out.
  # It is deliberately still a working default — the single-instance deployment
  # is the common case and should not need a value to install.
  #
  # What actually protects the sync case is not this file: BundleImportService
  # REFUSES a bundle whose origin equals the importing instance's own id
  # (BundleSelfOriginError). So a low/high pair left on the default fails loudly
  # at the first import, naming the problem, instead of quietly making replicas
  # writable. That guard covers Docker Compose and `aspire publish` too, which a
  # chart-only requirement never could.
  instanceId: standalone

  probes:
    # "http" (default) or "tcp".
    #
    #   http — what design.md §15 intends: /alive → liveness, /health →
    #          readiness. Outside Development those endpoints exist only
    #          behind an explicit opt-in (HealthEndpoints:Enabled, default
    #          false — src/RocketWiki.ServiceDefaults/Extensions.cs,
    #          MapDefaultEndpoints; they're unauthenticated and /health
    #          aggregates dependency state, so accidental exposure is the
    #          risk being managed). This chart sets HealthEndpoints__Enabled
    #          on the api container whenever this mode is selected, which is
    #          safe HERE because probes come from the kubelet over the pod
    #          network and the ingress never routes either path to the api
    #          Service — /health and /alive fall into the SPA catch-all
    #          (templates/ingress.yaml) — so they're enabled in the pod yet
    #          unreachable from outside the cluster. Keeping them off the api
    #          routes is this chart's job; the app's job is only refusing to
    #          map the endpoints unless asked.
    #   tcp  — fallback: liveness/readiness open a TCP connection to 8080.
    #          Proves Kestrel is up; says nothing about the DB. Weaker but
    #          dependency-free — the right choice if the health endpoints
    #          must stay unmapped even inside the pod network.
    mode: http

  resources:
    # Deliberately modest; nothing has ever measured this app under load
    # (README "Current status"), so these are starting points to revise with
    # real telemetry, not tested capacity statements.
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      # No CPU limit on purpose: CPU is compressible, and hard CPU limits
      # mostly buy throttling artifacts on a single-node k3s. Memory IS
      # limited so a leak evicts one pod instead of the node.
      memory: 1Gi

  fileStorage:
    # "S3" (default), "FileSystem", or "SqlServer" (design.md §10).
    #
    # SqlServer keeps attachment bytes in the database. It is deliberately not
    # the default — every upload lands in the transaction log, backups grow
    # with attachments, and large reads evict pages from the buffer pool — but
    # it is the only provider where one database backup covers content AND
    # attachments at a single point in time, and it needs no object store and
    # no PVC. On a single-node k3s that can be the whole reason to choose it:
    # nothing below is required, because with no
    # FileStorage__SqlServer__ConnectionString in api.existingSecret the
    # provider shares ConnectionStrings__rocketwiki. Add that key to the same
    # Secret to put blobs in a separate database instead (wiser when blob
    # churn shouldn't share a transaction log with page edits).
    provider: S3
    s3:
      # S3-compatible endpoint (MinIO/Ceph/...). Outside the cluster, or a
      # separately-managed in-cluster MinIO — this chart runs neither (§15:
      # stateful services need real storage decisions, not a default PVC).
      serviceUrl: "http://minio.internal:9000"
      bucket: rocketwiki
      # Required for MinIO/Ceph path-style addressing; harmless for AWS.
      forcePathStyle: true
      # Only meaningful where SigV4 region signing is validated. "" omits it.
      region: ""
      # AccessKey/SecretKey come from existingSecret, never from values.
    fileSystem:
      # Only used when provider=FileSystem. The chart mounts an EXISTING
      # PersistentVolumeClaim; it will not create one — §15: storage for
      # state is a deliberate operator decision (storage class, node
      # affinity, backup) that a chart default would quietly get wrong.
      # Template rendering fails if provider=FileSystem and this is empty.
      existingClaim: ""
      mountPath: /var/rocketwiki/attachments

  # design.md §21.15 "Additional selectors": the protective-marking selector
  # categories this instance recognises — compartments such as a programme
  # codeword that a marking carries beside its classification
  # (`UK SECRET APPLE …`). Reading such a page needs, per selector, eligibility
  # for the category (from the token) AND a grant of that value in the space
  # (§6.4); both gates fail closed.
  #
  # EMPTY by default, and that absence is a configuration, not a gap: with no
  # categories the marking control offers no selector pickers, access grants
  # carry no selector values, and a page whose marking carries a selector for a
  # category not listed here — arrived by sync, or the category was removed —
  # is visible to NOBODY. Both instances of a low/high pair must therefore list
  # every category that travels between them, spelled identically.
  #
  # Each entry renders into the API's indexed env form on the api container
  # (ProtectiveMarking__SelectorCategories__<n>__Name and friends —
  # docs/CONFIGURATION.md "Protective markings"). The API validates the whole
  # list at startup and REFUSES TO START on an invalid one, naming the offending
  # index: names and values must be non-empty upper-case tokens ([A-Z0-9_-], at
  # most 32 characters) and unique. Nothing here is a credential, which is why
  # it is a values block and not a key in api.existingSecret; it is a values
  # block rather than an api.extraEnv recipe for the reason given on
  # existingSecret above — reachable-only-via-extraEnv is the same thing as not
  # shipping it.
  #
  #   name         REQUIRED. The category, as it appears in marking labels.
  #   description  Optional. Shown to users beside the picker.
  #   claimName    Optional. The token claim that gates eligibility: a user is
  #                eligible only when that claim is exactly "yes" — one
  #                single-valued mapper per claim in Keycloak, see
  #                src/RocketWiki.AppHost/keycloak/README.md. Empty or omitted
  #                means EVERY user is eligible and the space grant alone
  #                decides; the schema rejects unknown keys so a misspelt
  #                claimName cannot silently become that.
  #   values       REQUIRED. The value list; a marking carries at most one per
  #                category.
  protectiveMarking:
    selectorCategories: []
    #  - name: FRUIT
    #    description: Fruit programme compartments
    #    claimName: fruit
    #    values: [APPLE, BANANA]
    #  - name: REGION
    #    description: Regional releasability
    #    values: [NORTH, SOUTH]

  # design.md §15 "Telemetry is not audit": OFF by default, fail-closed —
  # when disabled the OTEL_EXPORTER_OTLP_ENDPOINT env var is simply absent,
  # and ServiceDefaults registers NO exporter at all (Extensions.cs gates the
  # exporter on that exact variable), so telemetry cannot leave the pod. Turn
  # on only against a collector INSIDE the network boundary; traces/logs
  # carry no page content or query text by design, but where they go is still
  # a boundary question.
  otel:
    enabled: false
    # e.g. "http://otel-collector.observability.svc:4317" (gRPC).
    endpoint: ""
    # "grpc" (4317) or "http/protobuf" (4318).
    protocol: grpc

  # Escape hatch for plain (non-secret) env vars, e.g. Keycloak__Realm if the
  # realm name ever diverges from the authority URL's path. Standard k8s
  # EnvVar objects, passed through verbatim.
  extraEnv: []
  #  - name: Keycloak__Realm
  #    value: rocketwiki

# ---------------------------------------------------------------------------
# Web (static SPA behind nginx-unprivileged, Dockerfile.web)
# ---------------------------------------------------------------------------
web:
  image:
    repository: rocketwiki/web
    tag: "0.1.0"
    pullPolicy: IfNotPresent

  # nginx serving static files is stateless — >1 is safe here (unlike api.*)
  # but pointless on a single-node k3s, so the default matches the api.
  replicaCount: 1

  service:
    port: 8080 # nginx-unprivileged listens on 8080 (non-root can't bind 80)

  # REQUIRED. The Keycloak realm URL the web image was BUILT with
  # (`--build-arg VITE_OIDC_AUTHORITY=…` — see deploy/README.md "Building the
  # images"). Restate it here, exactly.
  #
  # This is the ONE build arg the chart carries, and it earns its place by being
  # load-bearing rather than documentary: its ORIGIN is what the CSP's
  # connect-src is derived from below, so sign-in and the policy that permits
  # sign-in are one value instead of two that must be kept in step. The other
  # VITE_* args are deliberately NOT restated here — the chart cannot check
  # them against the image, and a value nothing enforces is a value that drifts
  # and then lies.
  #
  # It still cannot be *verified* against the image (Vite inlines it; nothing in
  # a running container can report what it was built with). What it buys is that
  # a deployment has to state its authority explicitly, and that the CSP follows
  # from the statement — so the remaining failure mode is one wrong value that
  # breaks sign-in loudly, not two values that disagree.
  #
  # The default is a PLACEHOLDER, not a fallback. `.invalid` is the RFC 2606
  # reserved TLD that is guaranteed never to resolve, so an untouched value
  # cannot accidentally work: the derived CSP would permit an origin the image
  # was not built against, and sign-in fails at the first discovery fetch. It is
  # a real string rather than "" only because values.schema.json pins the SHAPE
  # (a scheme-less value has no origin to derive from) and `helm lint --strict`
  # validates this file itself — the same reason api.instanceId ships
  # "standalone" rather than empty. The install NOTES call it out by name.
  #
  #   oidcAuthority: https://keycloak.internal/realms/rocketwiki
  oidcAuthority: "https://keycloak.invalid/realms/rocketwiki"

  # Content-Security-Policy: the two directives that name EXTERNAL origins.
  #
  # Everything else in the policy is fixed in the image's nginx config
  # (deploy/docker/nginx/default.conf.template — read its header for the full
  # directive-by-directive reasoning). These two are values because the origins
  # they name are baked into the SPA bundle at BUILD time: Vite inlines every
  # VITE_* variable, so the running nginx has no way to discover what the image
  # was built against.
  #
  # *** Keep these in step with the image's build args, or sign-in breaks. ***
  #
  #   connectSrc is DERIVED from web.oidcAuthority above and normally left
  #   empty: the chart takes that URL's origin and renders
  #   `'self' <origin>`, which is what oidc-client-ts needs for its discovery,
  #   token and userinfo XHRs. 'self' already covers same-origin ws/wss, so
  #   /hubs needs nothing. Set it only to add MORE origins — an OTLP collector
  #   the bundle exports browser traces to, a second identity provider — and
  #   then you own the whole list, including the Keycloak origin.
  #
  #   frameSrc has nothing to derive from (draw.io is its own build arg), so it
  #   is stated. It must name the VITE_DRAWIO_URL origin if the diagram editor
  #   is enabled, and the Keycloak origin if silent renew falls back to its
  #   iframe. 'none' — the default — is correct for a build with no draw.io.
  #
  # Forgetting frameSrc breaks the diagram editor loudly at first use. The
  # alternative default (permit every origin) would fail silently and forever,
  # which is not the trade anything else here takes.
  #
  # Example for a deployment that also exports browser traces:
  #   csp:
  #     connectSrc: "'self' https://keycloak.internal https://otel.internal:4318"
  #     frameSrc: "https://drawio.internal https://keycloak.internal"
  csp:
    connectSrc: ""
    frameSrc: "'none'"

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# ---------------------------------------------------------------------------
# Ingress (k3s-bundled Traefik)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  # k3s installs Traefik with IngressClass "traefik". A standard
  # networking.k8s.io/v1 Ingress is used rather than Traefik's IngressRoute
  # CRD — decision reasoning in templates/ingress.yaml.
  className: traefik
  # "" matches any host — the sane default for an internal, single-instance
  # deployment reached by IP or an internal DNS name. Set to pin a hostname.
  host: ""
  # Traefik-specific tuning goes here (e.g. pinning to the websecure
  # entrypoint: traefik.ingress.kubernetes.io/router.entrypoints: websecure).
  annotations: {}
  # Standard Ingress TLS blocks. TLS termination is Traefik's job; certs are
  # an operator concern (k3s default cert, a corporate CA secret, or
  # cert-manager) — this chart only references a secret name.
  tls: []
  #  - secretName: rocketwiki-tls
  #    hosts: [wiki.internal]

# ---------------------------------------------------------------------------
# EF Core migration Job (design.md §15 "Migrations must leave startup")
# ---------------------------------------------------------------------------
migrate:
  # Runs the efbundle baked into the api image (see Dockerfile.api) as a Helm
  # pre-install/pre-upgrade hook, so the schema is migrated to completion
  # BEFORE the api Deployment rolls. The api container itself always runs
  # with Database__MigrateOnStartup=false (hardcoded in the template AND
  # defaulted in the image) — in this chart, migration is only ever the
  # Job's job.
  enabled: true
  # Give up rather than hammer a broken migration: 2 retries covers a
  # transient SQL connection blip; a real migration failure needs a human
  # (and leaves the failed Job behind for kubectl logs — see the template's
  # hook-delete-policy).
  backoffLimit: 2
  # Hard stop so a hung migration fails the release visibly instead of
  # blocking `helm upgrade` forever.
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# Pod-level security defaults (applied to api, web, and migrate pods)
# ---------------------------------------------------------------------------
# Non-root everywhere: the api image runs as the aspnet image's `app` user
# (UID 1654), web as nginx-unprivileged's UID 101; runAsNonRoot makes the
# kubelet enforce what the Dockerfiles declare. readOnlyRootFilesystem is
# NOT set, honestly: .NET wants a writable /tmp and nginx's entrypoint
# writes its envsubst output under /etc/nginx — both solvable with emptyDir
# mounts, but that hardening is unverified guesswork until something can
# actually run these images, so it's left as a documented follow-up rather
# than shipped broken.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
