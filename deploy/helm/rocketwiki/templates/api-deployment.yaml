{{- /*
Template-level guard, duplicating values.schema.json on purpose (belt and
braces — the schema can be sidestepped by editing the chart; this line makes
the intent survive that). design.md §15: SignalR presence groups and
per-user notification fan-out live in a per-process singleton
(RealtimeConnectionRegistry); at replicas > 1 they fragment silently — some
users just stop receiving notifications, which is worse than an outage.
SignalR is not the only reason, and it is the one that has an obvious fix —
so listing it alone is a trap: adding a Redis backplane would satisfy the
stated precondition while silently breaking the OTHER one. The embedding
background job (EmbeddingIndexer) has no claim protocol at all — no lease
column, no UPDATE..OUTPUT, no application lock. Its scan is a plain read and
its write a plain upsert, so two replicas would both select the same
oldest-N due pages and race the unique index on PageEmbedding; the loser's
unique-violation is caught by the job's generic failure handler and recorded
as a PAGE failure, which now also counts towards that page's quarantine
ceiling. Scale-out therefore needs BOTH a Redis backplane and a claim
protocol for the indexer, in the same change that removes this guard.
*/ -}}
{{- if gt (int .Values.api.replicaCount) 1 }}
{{- fail "api.replicaCount > 1 is unsupported: SignalR presence/notifications are per-process state, AND the embedding indexer has no claim protocol so replicas would race each other's pages (design.md §15/§9.2). Both need fixing before this guard comes out." }}
{{- end }}
{{- if and (eq .Values.api.fileStorage.provider "FileSystem") (not .Values.api.fileStorage.fileSystem.existingClaim) }}
{{- fail "api.fileStorage.provider=FileSystem requires api.fileStorage.fileSystem.existingClaim: this chart does not create storage for state (design.md §15) — create a PVC deliberately and reference it." }}
{{- end }}
{{- if and .Values.api.otel.enabled (not .Values.api.otel.endpoint) }}
{{- fail "api.otel.enabled=true requires api.otel.endpoint (an in-network collector, design.md §15 'Telemetry is not audit')." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocketwiki.fullname" . }}-api
  labels:
    {{- include "rocketwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  # Recreate, not RollingUpdate: at one replica a rolling update briefly runs
  # two pods, which is exactly the two-processes-of-per-process-state shape
  # the replica guard above exists to prevent (and would deadlock on a RWO
  # attachment PVC in FileSystem mode). A few seconds of downtime per deploy
  # is the honest cost of the single-replica shape §15 endorses.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rocketwiki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "rocketwiki.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- include "rocketwiki.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "rocketwiki.image" (dict "global" .Values.global "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The whole operator-created Secret becomes environment: its keys
          # ARE .NET config env names (ConnectionStrings__rocketwiki, ...) —
          # see values.yaml api.existingSecret for the contract. If the
          # Secret doesn't exist the pod fails with CreateContainerConfigError
          # rather than starting half-configured: fail closed.
          envFrom:
            - secretRef:
                name: {{ .Values.api.existingSecret | quote }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.api.aspnetcoreEnvironment | quote }}
            # Explicit rather than inherited from the base image, so the
            # reviewed manifest states the port it probes and serves.
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            # Hardcoded, not a value, on purpose: in this chart migrations
            # are ONLY ever applied by the pre-install/pre-upgrade Job
            # (design.md §15 "Migrations must leave startup"). The image
            # defaults this to false too; stating it here keeps the invariant
            # visible in `helm template` output where a reviewer looks.
            - name: Database__MigrateOnStartup
              value: "false"
            {{- if eq .Values.api.probes.mode "http" }}
            # Explicit opt-in for /health + /alive outside Development
            # (ServiceDefaults MapDefaultEndpoints, fail closed without it).
            # Safe to enable here because probes come from the kubelet over
            # the pod network, and the ingress never routes either path to
            # the api Service — see values.yaml api.probes for the posture.
            - name: HealthEndpoints__Enabled
              value: "true"
            {{- end }}
            {{- /*
              design.md §12. Emitted UNCONDITIONALLY — no `with` guard. It used to
              be wrapped in one, so an empty value omitted the variable entirely
              and the app's "standalone" fallback applied invisibly: nothing in the
              rendered manifest showed the instance identity at all, and a low/high
              pair on defaults both answered "standalone", which makes every
              imported space native rather than replica and therefore WRITABLE.
              values.schema.json refuses an empty string, so there is nothing left
              for a conditional to protect against, and always rendering the
              variable means the identity is visible in a `helm template` diff.
            */}}
            - name: Instance__Id
              value: {{ .Values.api.instanceId | quote }}
            - name: FileStorage__Provider
              value: {{ .Values.api.fileStorage.provider | quote }}
            {{- if eq .Values.api.fileStorage.provider "S3" }}
            {{- with .Values.api.fileStorage.s3.serviceUrl }}
            - name: FileStorage__S3__ServiceUrl
              value: {{ . | quote }}
            {{- end }}
            - name: FileStorage__S3__Bucket
              value: {{ .Values.api.fileStorage.s3.bucket | quote }}
            - name: FileStorage__S3__ForcePathStyle
              value: {{ .Values.api.fileStorage.s3.forcePathStyle | quote }}
            {{- with .Values.api.fileStorage.s3.region }}
            - name: FileStorage__S3__Region
              value: {{ . | quote }}
            {{- end }}
            {{- else if eq .Values.api.fileStorage.provider "FileSystem" }}
            - name: FileStorage__FileSystem__Root
              value: {{ .Values.api.fileStorage.fileSystem.mountPath | quote }}
            {{- end }}
            {{- /*
              provider=SqlServer needs no env from this chart: with no
              FileStorage__SqlServer__ConnectionString the provider shares
              ConnectionStrings__rocketwiki, which api.existingSecret already
              carries — that sharing is the reason to pick it (design.md §10).
              An operator wanting blobs in a SEPARATE database adds that key to
              the same Secret; it is credential material, so it arrives by
              reference like every other connection string and is never
              templated here. This branch is explicit rather than an `else`
              so a fourth provider can't silently inherit FileSystem's env.
            */}}
            {{- /*
              design.md §21.15. Each configured selector category becomes the
              API's indexed env form (ProtectiveMarking__SelectorCategories__<n>__*,
              docs/CONFIGURATION.md "Protective markings"), values nested under
              their category. Nothing renders for the empty default, and that
              absence IS the configuration: no categories, no pickers, and a page
              carrying any selector is visible to nobody. A category is vocabulary
              only: a page carries at most one value per category, and a reader
              sees it only when a space access grant that matches them carries
              that value. Nothing per category has an access consequence beyond
              its name and its values, so nothing else is rendered — in
              particular no ClaimName variable (retired 2026-09-04 with the
              selector-eligibility gate; values.schema.json refuses the key so a
              stale values file fails lint rather than rendering a variable the
              API no longer binds). Description is optional and has no access
              consequence, so it may be absent.
            */}}
            {{- range $i, $category := .Values.api.protectiveMarking.selectorCategories }}
            - name: {{ printf "ProtectiveMarking__SelectorCategories__%d__Name" $i }}
              value: {{ $category.name | quote }}
            {{- with $category.description }}
            - name: {{ printf "ProtectiveMarking__SelectorCategories__%d__Description" $i }}
              value: {{ . | quote }}
            {{- end }}
            {{- range $j, $value := $category.values }}
            - name: {{ printf "ProtectiveMarking__SelectorCategories__%d__Values__%d" $i $j }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- /*
              Feature flags (docs/CONFIGURATION.md "Feature flags"; values.yaml
              api.features for the semantics). Rendered UNCONDITIONALLY, like
              Instance__Id above: the API treats an absent variable as ON, so a `with`
              guard that dropped a true would be harmless to the app but would hide the
              switch from the manifest a reviewer reads — stating all six makes "what is
              on here" a diff-visible fact. One explicit entry per flag rather than a
              range over the map, so the variable name the API reads is written here
              verbatim; FeatureFlagNameAgreementTests pins each name to the code and to
              the values key that feeds it.
            */}}
            - name: FeatureManagement__AskWiki
              value: {{ .Values.api.features.askWiki | quote }}
            - name: FeatureManagement__SemanticSearch
              value: {{ .Values.api.features.semanticSearch | quote }}
            - name: FeatureManagement__GitLab
              value: {{ .Values.api.features.gitLab | quote }}
            - name: FeatureManagement__Mcp
              value: {{ .Values.api.features.mcp | quote }}
            - name: FeatureManagement__CoEditing
              value: {{ .Values.api.features.coEditing | quote }}
            - name: FeatureManagement__Sync
              value: {{ .Values.api.features.sync | quote }}
            {{- if .Values.api.otel.enabled }}
            # design.md §15 "Telemetry is not audit": presence of this
            # variable is the ONLY thing that enables an exporter
            # (ServiceDefaults gates on it), so disabled means absent means
            # nothing leaves the pod. The endpoint must be inside the
            # network boundary.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.api.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.api.otel.protocol | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-api" (include "rocketwiki.fullname" .) | quote }}
            {{- end }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq .Values.api.probes.mode "http" }}
          # Paired with HealthEndpoints__Enabled above: the endpoints exist in
          # the pod because this mode asked for them, and stay unrouted at the
          # ingress (see values.yaml api.probes).
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          {{- else }}
          # TCP probes: proves Kestrel accepts connections; deliberately
          # claims nothing about database health. The fallback for operators
          # who want the health endpoints unmapped even inside the pod
          # network (values.yaml api.probes).
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          {{- end }}
          # Generous first-start window (JIT, EF model build); after this the
          # liveness probe takes over at its tighter cadence.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          {{- if eq .Values.api.fileStorage.provider "FileSystem" }}
          volumeMounts:
            - name: attachments
              mountPath: {{ .Values.api.fileStorage.fileSystem.mountPath | quote }}
          {{- end }}
      {{- if eq .Values.api.fileStorage.provider "FileSystem" }}
      volumes:
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ .Values.api.fileStorage.fileSystem.existingClaim | quote }}
      {{- end }}
