apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocketwiki.fullname" . }}-web
  labels:
    {{- include "rocketwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rocketwiki.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
