apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocketwiki.fullname" . }}-web
  labels:
    {{- include "rocketwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "rocketwiki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "rocketwiki.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "rocketwiki.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "rocketwiki.image" (dict "global" .Values.global "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080 # nginx-unprivileged's non-root port
              protocol: TCP
          env:
            # Substituted into nginx's proxy_pass at container start (the
            # image config is an envsubst template — deploy/docker/nginx/).
            # This is how the SPA's same-origin /graphql, /hubs, /attachments
            # defaults keep working through ANY door, including
            # kubectl port-forward, not just the ingress.
            - name: API_UPSTREAM
              value: {{ printf "%s-api:%v" (include "rocketwiki.fullname" .) .Values.api.service.port | quote }}
            # The two Content-Security-Policy directives that have to name
            # EXTERNAL origins. They are runtime values because the origins are
            # baked into the SPA bundle at BUILD time (Vite inlines VITE_*), so
            # nginx cannot read what the image was built against — see
            # deploy/docker/nginx/default.conf.template's header and values.yaml.
            #
            # connect-src is DERIVED from web.oidcAuthority (the same value the
            # image's --build-arg VITE_OIDC_AUTHORITY carried), so the origin
            # sign-in needs cannot drift from the origin the policy allows —
            # they are one value, stated once. web.csp.connectSrc overrides it
            # for deployments that need more origins in the list.
            #
            # frame-src has no such source to derive from — draw.io is a
            # separate build arg — so it stays an explicit value defaulting to
            # 'none': forgetting it breaks the diagram editor loudly rather
            # than silently permitting every origin to frame content.
            - name: CSP_CONNECT_SRC
              value: {{ include "rocketwiki.web.cspConnectSrc" . | quote }}
            - name: CSP_FRAME_SRC
              value: {{ .Values.web.csp.frameSrc | quote }}
          # Plain HTTP GET of the SPA shell — for a static file server that
          # IS the health check. nginx fails to start entirely (and the probe
          # never passes) if the API_UPSTREAM hostname doesn't resolve, which
          # correctly holds the web pod out of service until the api Service
          # exists.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
