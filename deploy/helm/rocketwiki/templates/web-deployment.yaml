apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocketwiki.fullname" . }}-web
  labels:
    {{- include "rocketwiki.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "rocketwiki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "rocketwiki.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- include "rocketwiki.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "rocketwiki.image" (dict "global" .Values.global "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080 # nginx-unprivileged's non-root port
              protocol: TCP
          env:
            # Substituted into nginx's proxy_pass at container start (the
            # image config is an envsubst template — deploy/docker/nginx/).
            # This is how the SPA's same-origin /graphql, /hubs, /attachments
            # defaults keep working through ANY door, including
            # kubectl port-forward, not just the ingress.
            - name: API_UPSTREAM
              value: {{ printf "%s-api:%v" (include "rocketwiki.fullname" .) .Values.api.service.port | quote }}
          # Plain HTTP GET of the SPA shell — for a static file server that
          # IS the health check. nginx fails to start entirely (and the probe
          # never passes) if the API_UPSTREAM hostname doesn't resolve, which
          # correctly holds the web pod out of service until the api Service
          # exists.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
