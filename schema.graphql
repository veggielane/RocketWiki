schema {
  query: Query
  mutation: Mutation
}

type Query {
  auditEvents(
    filter: AuditFilterInput!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): AuditEventsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  page(id: UUID!): Page @cost(weight: "10")
  pageTree(spaceId: UUID!): [PageTreeNode!]! @cost(weight: "10")
  me: CurrentUser!
  notifications: [Notification!]! @cost(weight: "10")
  spaces: [Space!]! @cost(weight: "10")
  space(key: String!): Space @cost(weight: "10")
}

type Mutation {
  createAccessRule(input: CreateAccessRuleRequestInput!): CreateAccessRulePayload!
    @cost(weight: "10")
  updateAccessRule(input: UpdateAccessRuleRequestInput!): UpdateAccessRulePayload!
    @cost(weight: "10")
  deleteAccessRule(input: DeleteAccessRuleRequestInput!): DeleteAccessRulePayload!
    @cost(weight: "10")
  deleteAttachment(input: DeleteAttachmentRequestInput!): DeleteAttachmentPayload!
    @cost(weight: "10")
  addComment(input: AddCommentRequestInput!): AddCommentPayload!
    @cost(weight: "10")
  editComment(input: EditCommentRequestInput!): EditCommentPayload!
    @cost(weight: "10")
  deleteComment(input: DeleteCommentRequestInput!): DeleteCommentPayload!
    @cost(weight: "10")
  createPage(input: CreatePageRequestInput!): CreatePagePayload!
    @cost(weight: "10")
  updatePageContent(input: UpdatePageContentRequestInput!): UpdatePageContentPayload!
    @cost(weight: "10")
  movePage(input: MovePageRequestInput!): MovePagePayload! @cost(weight: "10")
  deletePage(input: DeletePageRequestInput!): DeletePagePayload!
    @cost(weight: "10")
  restorePage(input: RestorePageRequestInput!): RestorePagePayload!
    @cost(weight: "10")
  restoreRevision(input: RestoreRevisionRequestInput!): RestoreRevisionPayload!
    @cost(weight: "10")
  createLabel(input: CreateLabelRequestInput!): CreateLabelPayload!
    @cost(weight: "10")
  attachLabel(input: AttachLabelRequestInput!): AttachLabelPayload!
    @cost(weight: "10")
  detachLabel(input: DetachLabelRequestInput!): DetachLabelPayload!
    @cost(weight: "10")
  markNotificationRead(input: MarkNotificationReadInput!): MarkNotificationReadPayload!
    @cost(weight: "10")
  createSpace(
    input: CreateSpaceRequestInput!
    initialGrant: InitialSpaceGrantInput!
  ): CreateSpacePayload! @cost(weight: "10")
  renameSpace(input: RenameSpaceRequestInput!): RenameSpacePayload!
    @cost(weight: "10")
  archiveSpace(input: ArchiveSpaceRequestInput!): ArchiveSpacePayload!
    @cost(weight: "10")
  restoreSpace(input: RestoreSpaceRequestInput!): RestoreSpacePayload!
    @cost(weight: "10")
  watchPage(input: WatchPageRequestInput!): WatchPagePayload!
    @cost(weight: "10")
  unwatchPage(input: UnwatchPageRequestInput!): UnwatchPagePayload!
    @cost(weight: "10")
  watchSpace(input: WatchSpaceRequestInput!): WatchSpacePayload!
    @cost(weight: "10")
  unwatchSpace(input: UnwatchSpaceRequestInput!): UnwatchSpacePayload!
    @cost(weight: "10")
}

type AccessRule {
  id: UUID!
  kind: AccessRuleKind!
  spaceId: UUID
  pageId: UUID
  role: SpaceRole
  action: PageAction
  expressionJson: String!
  createdAtUtc: DateTime!
  createdByUserId: UUID!
  updatedAtUtc: DateTime!
  updatedByUserId: UUID!
}

type AddCommentPayload {
  comment: Comment
  error: PageMutationErrorView
}

type ArchiveSpacePayload {
  space: Space
  error: PageMutationErrorView
}

type AttachLabelPayload {
  pageLabel: PageLabel
  error: PageMutationErrorView
}

type Attachment {
  id: UUID!
  pageId: UUID!
  fileName: String!
  contentType: String!
  sizeBytes: Long!
  contentHash: [UnsignedByte!]!
  isDeleted: Boolean!
  deletedAtUtc: DateTime
  deletedByUserId: UUID
  uploadedByUserId: UUID!
  createdAtUtc: DateTime!
}

type AuditEvent {
  userDisplayName: String @cost(weight: "10")
  id: Long!
  timestampUtc: DateTime!
  userId: UUID
  action: String!
  subjectType: AuditSubjectType
  subjectId: UUID
  spaceKey: String
  outcome: AuditOutcome!
  channel: AuditChannel!
  requestId: String!
  clientIp: String!
  mcpClient: String
  detailsJson: String
}

"A connection to a list of items."
type AuditEventsConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [AuditEventsEdge!]
  "A flattened list of the nodes."
  nodes: [AuditEvent!]
}

"An edge in a connection."
type AuditEventsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: AuditEvent!
}

type Comment {
  id: UUID!
  pageId: UUID!
  parentCommentId: UUID
  body: String!
  authorUserId: UUID!
  createdAtUtc: DateTime!
  editedAtUtc: DateTime
  isDeleted: Boolean!
}

type CreateAccessRulePayload {
  rule: AccessRule
  error: PageMutationErrorView
}

type CreateLabelPayload {
  label: Label
  error: PageMutationErrorView
}

type CreatePagePayload {
  page: Page
  error: PageMutationErrorView
}

type CreateSpacePayload {
  space: Space
  error: PageMutationErrorView
}

type CurrentUser {
  id: String
  email: String
  name: String
  groups: [String!]!
  isAuthenticated: Boolean!
}

type DeleteAccessRulePayload {
  deletedRuleId: UUID
  error: PageMutationErrorView
}

type DeleteAttachmentPayload {
  attachment: Attachment
  error: PageMutationErrorView
}

type DeleteCommentPayload {
  comment: Comment
  error: PageMutationErrorView
}

type DeletePagePayload {
  summary: PageDeleteSummary
  error: PageMutationErrorView
}

type DetachLabelPayload {
  detachedLabelId: UUID
  error: PageMutationErrorView
}

type EditCommentPayload {
  comment: Comment
  error: PageMutationErrorView
}

type Label {
  id: UUID!
  spaceId: UUID!
  space: Space
  name: String!
  pageLabels: [PageLabel!]!
}

type MarkNotificationReadPayload {
  notification: Notification
  error: PageMutationErrorView
}

type MovePagePayload {
  page: Page
  error: PageMutationErrorView
}

type Notification {
  id: String!
  type: String!
  pageId: UUID
  spaceKey: String
  pageTitle: String
  actorDisplayName: String!
  createdAtUtc: DateTime!
  readAtUtc: DateTime
}

type Page {
  content: String!
  parent: Page @cost(weight: "10")
  children: [Page!]! @cost(weight: "10")
  revisions: [PageRevision!]! @cost(weight: "10")
  comments: [Comment!]! @cost(weight: "10")
  attachments: [Attachment!]! @cost(weight: "10")
  labels: [String!]! @cost(weight: "10")
  id: UUID!
  spaceId: UUID!
  parentPageId: UUID
  ancestorPath: String!
  slug: String!
  title: String!
  sortOrder: Int!
  currentRevisionNumber: Int!
  isDeleted: Boolean!
  deletedAtUtc: DateTime
  deletedByUserId: UUID
  deleteBatchId: UUID
  createdAtUtc: DateTime!
  updatedAtUtc: DateTime!
}

type PageDeleteSummary {
  rootPageId: UUID!
  deletedPageCount: Int!
  deletedAtUtc: DateTime!
}

"Information about pagination in a connection."
type PageInfo {
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
  "When paginating forwards, the cursor to continue."
  endCursor: String
}

type PageLabel {
  pageId: UUID!
  page: Page
  labelId: UUID!
  label: Label
}

type PageMutationErrorView {
  kind: String!
  message: String
  expectedRevisionNumber: Int
  actualRevisionNumber: Int
  latestTitle: String
  latestContent: String
  spaceId: UUID
  blockedPageCount: Int
  notFoundId: UUID
}

type PageRestoreSummary {
  rootPageId: UUID!
  restoredPageCount: Int!
}

type PageRevision {
  id: UUID!
  pageId: UUID!
  revisionNumber: Int!
  title: String!
  content: String!
  editSummary: String
  authorUserId: UUID!
  createdAtUtc: DateTime!
}

type PageTreeNode {
  id: UUID!
  title: String!
  slug: String!
  sortOrder: Int!
  children: [PageTreeNode!]!
}

type RenameSpacePayload {
  space: Space
  error: PageMutationErrorView
}

type RestorePagePayload {
  summary: PageRestoreSummary
  error: PageMutationErrorView
}

type RestoreRevisionPayload {
  page: Page
  error: PageMutationErrorView
}

type RestoreSpacePayload {
  space: Space
  error: PageMutationErrorView
}

type Space {
  grants: [AccessRule!]! @cost(weight: "10")
  trashedPages: [Page!]! @cost(weight: "10")
  isReplicaOf(localInstanceId: String!): Boolean!
  id: UUID!
  key: String!
  name: String!
  description: String
  homepageId: UUID
  originInstanceId: String!
  isExported: Boolean!
  lastOutboxSequence: Long!
  isDeleted: Boolean!
  deletedAtUtc: DateTime
  deletedByUserId: UUID
  createdAtUtc: DateTime!
  createdByUserId: UUID!
}

type UnwatchPagePayload {
  watch: WatchView
  error: PageMutationErrorView
}

type UnwatchSpacePayload {
  watch: WatchView
  error: PageMutationErrorView
}

type UpdateAccessRulePayload {
  rule: AccessRule
  error: PageMutationErrorView
}

type UpdatePageContentPayload {
  page: Page
  error: PageMutationErrorView
}

type WatchPagePayload {
  watch: WatchView
  error: PageMutationErrorView
}

type WatchSpacePayload {
  watch: WatchView
  error: PageMutationErrorView
}

type WatchView {
  id: UUID!
  pageId: UUID
  spaceId: UUID
  createdAtUtc: DateTime!
}

input AddCommentRequestInput {
  pageId: UUID!
  parentCommentId: UUID
  body: String!
}

input ArchiveSpaceRequestInput {
  spaceId: UUID!
}

input AttachLabelRequestInput {
  pageId: UUID!
  labelId: UUID!
}

input AuditFilterInput {
  userId: UUID
  action: String
  subjectType: AuditSubjectType
  subjectId: UUID
  outcome: AuditOutcome
  fromUtc: DateTime
  toUtc: DateTime
}

input CreateAccessRuleRequestInput {
  kind: AccessRuleKind!
  spaceId: UUID
  pageId: UUID
  role: SpaceRole
  action: PageAction
  expressionJson: String!
}

input CreateLabelRequestInput {
  spaceId: UUID!
  name: String!
}

input CreatePageRequestInput {
  spaceId: UUID!
  parentPageId: UUID
  slug: String!
  title: String!
  content: String!
}

input CreateSpaceRequestInput {
  key: String!
  name: String!
  description: String
}

input DeleteAccessRuleRequestInput {
  accessRuleId: UUID!
}

input DeleteAttachmentRequestInput {
  attachmentId: UUID!
}

input DeleteCommentRequestInput {
  commentId: UUID!
}

input DeletePageRequestInput {
  pageId: UUID!
}

input DetachLabelRequestInput {
  pageId: UUID!
  labelId: UUID!
}

input EditCommentRequestInput {
  commentId: UUID!
  body: String!
}

input InitialSpaceGrantInput {
  role: SpaceRole!
  expressionJson: String!
}

input MarkNotificationReadInput {
  notificationId: String!
}

input MovePageRequestInput {
  pageId: UUID!
  newParentPageId: UUID
  newSortOrder: Int!
}

input RenameSpaceRequestInput {
  spaceId: UUID!
  name: String!
  description: String
}

input RestorePageRequestInput {
  pageId: UUID!
}

input RestoreRevisionRequestInput {
  pageId: UUID!
  revisionNumberToRestore: Int!
  expectedCurrentRevisionNumber: Int!
}

input RestoreSpaceRequestInput {
  spaceId: UUID!
}

input UnwatchPageRequestInput {
  pageId: UUID!
}

input UnwatchSpaceRequestInput {
  spaceId: UUID!
}

input UpdateAccessRuleRequestInput {
  accessRuleId: UUID!
  expressionJson: String!
  role: SpaceRole
  action: PageAction
}

input UpdatePageContentRequestInput {
  pageId: UUID!
  expectedRevisionNumber: Int!
  title: String!
  content: String!
  editSummary: String
}

input WatchPageRequestInput {
  pageId: UUID!
}

input WatchSpaceRequestInput {
  spaceId: UUID!
}

enum AccessRuleKind {
  SPACE_GRANT
  PAGE_RESTRICTION
}

enum AuditChannel {
  GRAPH_QL
  MCP
  ATTACHMENT
  SYNC
  SYSTEM
}

enum AuditOutcome {
  SUCCESS
  DENIED
}

enum AuditSubjectType {
  PAGE
  SPACE
  ATTACHMENT
  COMMENT
  RULE
}

enum PageAction {
  VIEW
  EDIT
}

enum SpaceRole {
  VIEWER
  EDITOR
  SPACE_ADMIN
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Long` scalar type represents a signed 64-bit integer."
scalar Long
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/long.html")

"The `UnsignedByte` scalar type represents an unsigned 8-bit integer."
scalar UnsignedByte
  @specifiedBy(
    url: "https://scalars.graphql.org/chillicream/unsigned-byte.html"
  )

"The `UUID` scalar type represents a Universally Unique Identifier (UUID) as defined by RFC 9562."
scalar UUID
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/uuid.html")

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost(
  "The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc."
  weight: String!
) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

"The purpose of the `@listSize` directive is to either inform the static analysis about the size of returned lists (if that information is statically available), or to point the analysis to where to find that information."
directive @listSize(
  "The `assumedSize` argument can be used to statically define the maximum length of a list returned by a field."
  assumedSize: Int
  "The `slicingArguments` argument can be used to define which of the field's arguments with numeric type are slicing arguments, so that their value determines the size of the list returned by that field. It may specify a list of multiple slicing arguments."
  slicingArguments: [String!]
  "The `slicingArgumentDefaultValue` argument can be used to define a default value for a slicing argument, which is used if the argument is not present in a query."
  slicingArgumentDefaultValue: Int
  "The `sizedFields` argument can be used to define that the value of the `assumedSize` argument or of a slicing argument does not affect the size of a list returned by a field itself, but that of a list returned by one of its sub-fields."
  sizedFields: [String!]
  "The `requireOneSlicingArgument` argument can be used to inform the static analysis that it should expect that exactly one of the defined slicing arguments is present in a query. If that is not the case (i.e., if none or multiple slicing arguments are present), the static analysis may throw an error."
  requireOneSlicingArgument: Boolean = true
) on FIELD_DEFINITION
