schema {
  query: Query
  mutation: Mutation
}

type Query {
  analytics(spaceKey: String, fromUtc: DateTime!, toUtc: DateTime!): AnalyticsReport
    @cost(weight: "10")
  archivedSpaces: [ArchivedSpace!]! @cost(weight: "10")
  askWiki(question: String!): AskWikiPayload! @cost(weight: "10")
  auditEvents(
    filter: AuditFilterInput!
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
  ): AuditEventsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  page(id: UUID!): Page @cost(weight: "10")
  pageBySlug(spaceKey: String!, slug: String!): Page @cost(weight: "10")
  pageTree(spaceId: UUID!): [PageTreeNode!]! @cost(weight: "10")
  pageSubtree(spaceId: UUID!, pageId: UUID!): [PageTreeNode!]!
    @cost(weight: "10")
  me: CurrentUser! @cost(weight: "10")
  customEmojis: [CustomEmojiRef!]! @cost(weight: "10")
  effectivePermission(pageId: UUID!, subject: InspectedPrincipalInput): EffectivePermissionDetail
    @cost(weight: "10")
  pageForms(pageId: UUID!): PageFormsView @cost(weight: "10")
  gitlabIssue(projectId: String!, iid: Int!): GitLabIssuePayload!
    @cost(weight: "10")
  gitlabIssues(projectId: String!, filter: GitLabIssueFilterInput, first: Int): GitLabIssuesPayload!
    @cost(weight: "10")
  gitlabFile(projectId: String!, path: String!, ref: String): GitLabFilePayload!
    @cost(weight: "10")
  gitlabStatus: GitLabStatus! @cost(weight: "10")
  labels(spaceKey: String): [String!]! @cost(weight: "10")
  labelDetails(spaceKey: String): [LabelRef!]! @cost(weight: "10")
  notifications: [Notification!]! @cost(weight: "10")
  pageEntries(pageId: UUID!, collection: String!): [PageEntryView!]
    @cost(weight: "10")
  pagePropertyKeys: [PagePropertyKeyRef!]! @cost(weight: "10")
  pageQuery(query: String!, first: Int, after: String): PageQueryConnection!
    @cost(weight: "10")
  parseRql(query: String!): RqlParseResult!
  classificationScheme: [ClassificationLevelInfo!]!
  groups: [String!]! @cost(weight: "10")
  attributeRegistry: [AttributeDefinition!]! @cost(weight: "10")
  search(query: String!, spaceKey: String, labels: [String!], after: String): SearchConnection!
    @cost(weight: "10")
  spaces: [Space!]! @cost(weight: "10")
  space(key: String!): Space @cost(weight: "10")
  syncStatus: SyncStatusView! @cost(weight: "10")
}

type Mutation {
  createAccessRule(input: CreateAccessRuleRequestInput!): CreateAccessRulePayload!
    @cost(weight: "10")
  updateAccessRule(input: UpdateAccessRuleRequestInput!): UpdateAccessRulePayload!
    @cost(weight: "10")
  deleteAccessRule(input: DeleteAccessRuleRequestInput!): DeleteAccessRulePayload!
    @cost(weight: "10")
  deleteAttachment(input: DeleteAttachmentRequestInput!): DeleteAttachmentPayload!
    @cost(weight: "10")
  addComment(input: AddCommentRequestInput!): AddCommentPayload!
    @cost(weight: "10")
  editComment(input: EditCommentRequestInput!): EditCommentPayload!
    @cost(weight: "10")
  deleteComment(input: DeleteCommentRequestInput!): DeleteCommentPayload!
    @cost(weight: "10")
  createPage(input: CreatePageRequestInput!): CreatePagePayload!
    @cost(weight: "10")
  updatePageContent(input: UpdatePageContentRequestInput!): UpdatePageContentPayload!
    @cost(weight: "10")
  movePage(input: MovePageRequestInput!): MovePagePayload! @cost(weight: "10")
  deletePage(input: DeletePageRequestInput!): DeletePagePayload!
    @cost(weight: "10")
  restorePage(input: RestorePageRequestInput!): RestorePagePayload!
    @cost(weight: "10")
  restoreRevision(input: RestoreRevisionRequestInput!): RestoreRevisionPayload!
    @cost(weight: "10")
  setGitLabToken(input: SetGitLabTokenRequestInput!): SetGitLabTokenPayload!
    @cost(weight: "10")
  clearGitLabToken: ClearGitLabTokenPayload! @cost(weight: "10")
  createLabel(input: CreateLabelRequestInput!): CreateLabelPayload!
    @cost(weight: "10")
  attachLabel(input: AttachLabelRequestInput!): AttachLabelPayload!
    @cost(weight: "10")
  detachLabel(input: DetachLabelRequestInput!): DetachLabelPayload!
    @cost(weight: "10")
  markNotificationRead(input: MarkNotificationReadInput!): MarkNotificationReadPayload!
    @cost(weight: "10")
  createPageEntry(input: CreatePageEntryInput!): CreatePageEntryPayload!
    @cost(weight: "10")
  updatePageEntry(input: UpdatePageEntryInput!): UpdatePageEntryPayload!
    @cost(weight: "10")
  deletePageEntry(input: DeletePageEntryInput!): DeletePageEntryPayload!
    @cost(weight: "10")
  setPageMarking(input: SetPageMarkingRequestInput!): SetPageMarkingPayload!
    @cost(weight: "10")
  setPageProperty(input: SetPagePropertyRequestInput!): SetPagePropertyPayload!
    @cost(weight: "10")
  removePageProperty(input: RemovePagePropertyRequestInput!): RemovePagePropertyPayload!
    @cost(weight: "10")
  createPagePropertyKey(input: CreatePagePropertyKeyRequestInput!): CreatePagePropertyKeyPayload!
    @cost(weight: "10")
  deletePagePropertyKey(keyId: UUID!): DeletePagePropertyKeyPayload!
    @cost(weight: "10")
  createSpace(
    input: CreateSpaceRequestInput!
    initialGrant: InitialSpaceGrantInput!
  ): CreateSpacePayload! @cost(weight: "10")
  renameSpace(input: RenameSpaceRequestInput!): RenameSpacePayload!
    @cost(weight: "10")
  setSpaceHomepage(input: SetSpaceHomepageRequestInput!): SetSpaceHomepagePayload!
    @cost(weight: "10")
  archiveSpace(input: ArchiveSpaceRequestInput!): ArchiveSpacePayload!
    @cost(weight: "10")
  restoreSpace(input: RestoreSpaceRequestInput!): RestoreSpacePayload!
    @cost(weight: "10")
  watchPage(input: WatchPageRequestInput!): WatchPagePayload!
    @cost(weight: "10")
  unwatchPage(input: UnwatchPageRequestInput!): UnwatchPagePayload!
    @cost(weight: "10")
  watchSpace(input: WatchSpaceRequestInput!): WatchSpacePayload!
    @cost(weight: "10")
  unwatchSpace(input: UnwatchSpaceRequestInput!): UnwatchSpacePayload!
    @cost(weight: "10")
}

