# GitLab CI — the mirror of .github/workflows/ci.yml.
#
# The two files must assert the SAME THINGS. Where a check exists only to catch
# a defect that actually happened (the corpus drift guards, the SQL Server
# skip-guard, the chart's promised failures), it is reproduced here in full
# rather than trimmed, because a mirror that checks less is a mirror that lets
# the mirrored branch rot.
#
# WHAT DOES NOT TRANSLATE, and what was done instead:
#
#   * `permissions: contents: read`. GitHub scopes the job token per workflow;
#     GitLab scopes it per project, in project settings. There is no file-level
#     equivalent, so set CI/CD > Token Access to read-only for this project. It
#     is not expressible here, so it is not silently assumed here.
#   * Runner OS pinning. The GitHub sqlserver job pins ubuntu-22.04 because the
#     24.04 host pool crashed SQL Server at engine boot (SQLPAL, errno 11). That
#     is a property of GitHub's pool, not a portable instruction. On GitLab the
#     equivalent lever is which runner picks the job, so `sqlserver` carries a
#     `docker-privileged` tag: point it at a runner you control and, if the same
#     boot crash appears, that runner's host is the thing to change.
#   * buildx's `type=gha` cache. Replaced with a registry cache in this
#     project's own container registry, which is the closest equivalent GitLab
#     has. It needs no extra credentials: CI_REGISTRY_* are injected.
#   * `actions/setup-node` reading .nvmrc. A GitLab image tag cannot be read
#     from a file, so the Node major is written once in NODE_IMAGE below and a
#     guard asserts it still matches .nvmrc. .nvmrc stays the source of truth;
#     drift fails loudly instead of the two quietly diverging.
#
# Docker-in-Docker is required by two jobs (`sqlserver` runs Testcontainers,
# `helm` builds the web image to prove its build-arg guard). Both are tagged
# `docker-privileged`; a runner with `privileged = true` must carry that tag.

stages:
  - test

variables:
  # Pinned to global.json's SDK major and .nvmrc respectively. Both are asserted
  # against their source of truth below rather than trusted.
  DOTNET_IMAGE: 'mcr.microsoft.com/dotnet/sdk:10.0'
  NODE_IMAGE: 'node:24'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  GIT_DEPTH: '0'

# A push that supersedes an in-flight pipeline cancels it: the sqlserver job
# boots a real SQL Server per run, so stacking pipelines is the expensive kind
# of waste. `interruptible` is only half of it — also enable
# Settings > CI/CD > General pipelines > "Auto-cancel redundant pipelines".
default:
  interruptible: true

.docker_dind: &docker_dind
  tags:
    - docker-privileged
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: 'tcp://docker:2376'
    DOCKER_TLS_CERTDIR: '/certs'
    DOCKER_CERT_PATH: '/certs/client'
    DOCKER_TLS_VERIFY: '1'
    # Testcontainers talks to the same daemon the shell does.
    TESTCONTAINERS_RYUK_DISABLED: 'false'

# ---------------------------------------------------------------------------
# backend — the container-free tier. Its green run is what proves the EF model
# and LINQ stay provider-agnostic (design.md §14).
# ---------------------------------------------------------------------------
backend:
  stage: test
  image: $DOTNET_IMAGE
  timeout: 20m
  script:
    - dotnet build RocketWiki.sln --configuration Release
    # RocketWiki.SqlServer.Tests is excluded HERE only because it has its own
    # job below, whose skip-guard asserts every one of its tests executed.
    # Running it twice would double the container work per push for no coverage.
    - >
      dotnet test RocketWiki.sln --configuration Release --no-build
      --filter "FullyQualifiedName!~RocketWiki.SqlServer.Tests"
    # The converted-markdown corpus is regenerated by the importer's test run.
    # Regenerating proves it matches the converter's CURRENT behaviour; only
    # this check proves the committed files match too (design.md §13).
    - |
      if [ -n "$(git status --porcelain tests/fixtures/converted-markdown)" ]; then
        echo "ERROR: tests/fixtures/converted-markdown changed when the tests regenerated it."
        echo "The Confluence converter's output no longer matches the committed corpus."
        echo "Review the diff, then commit it if the change is intended:"
        git --no-pager diff -- tests/fixtures/converted-markdown
        exit 1
      fi

# ---------------------------------------------------------------------------
# sqlserver — design.md §14 tier 3, and this is the tier's first-class home.
# On machines without Docker the whole project skips VISIBLY; here it must
# actually run, and the skip-guard turns a silent skip into a red pipeline,
# because a skipped tier that stays green is a tier that does not exist.
# ---------------------------------------------------------------------------
sqlserver:
  stage: test
  image: $DOTNET_IMAGE
  <<: *docker_dind
  timeout: 40m
  variables:
    ROCKETWIKI_MSSQL_FTS_IMAGE: 'rocketwiki-mssql-fts:ci'
    ROCKETWIKI_SQLSERVER_TEST_LOGS: '$CI_PROJECT_DIR/sqlserver-container-logs'
  before_script:
    # The FTS-enabled image: stock mssql/server has no Full-Text Search, and the
    # InitialCreate migration's FULLTEXT DDL hard-fails without it. Built as an
    # explicit step, not left to the test fixture, so an apt or repo breakage
    # fails HERE with a readable build log. Registry-cached so warm runs skip
    # both the MCR pull and the apt install. If this step or the env var above
    # were ever lost, the fixture would build the same Dockerfile itself:
    # slower, never silently skipped.
    - apt-get update && apt-get install -y --no-install-recommends docker.io
    - docker buildx create --use --driver docker-container
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >
      docker buildx build docker/mssql-fts
      --tag "$ROCKETWIKI_MSSQL_FTS_IMAGE"
      --load
      --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/mssql-fts:buildcache"
      --cache-to "type=registry,ref=$CI_REGISTRY_IMAGE/mssql-fts:buildcache,mode=max"
  script:
    - dotnet build tests/RocketWiki.SqlServer.Tests --configuration Release
    - >
      dotnet test tests/RocketWiki.SqlServer.Tests --configuration Release --no-build
      --logger "console;verbosity=normal"
      --logger "trx;LogFileName=sqlserver.trx"
      --results-directory sqlserver-test-results
    # `dotnet test` exits 0 when every test skips — which on this runner would
    # mean the Docker probe failed and the tier silently vanished. A skipped
    # xUnit test appears in `total` but not in `executed`, so the invariant on a
    # CI runner is executed == total, and executed > 0.
    - |
      trx=sqlserver-test-results/sqlserver.trx
      counters=$(grep -o '<Counters [^/]*/>' "$trx")
      echo "$counters"
      total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
      executed=$(echo "$counters" | grep -o 'executed="[0-9]*"' | grep -o '[0-9]*')
      if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
        echo "ERROR: The SQL Server tier executed zero tests — Docker on the runner is broken, and the tier's coverage silently disappeared."
        exit 1
      fi
      if [ "$executed" -ne "$total" ]; then
        echo "ERROR: Only $executed of $total SQL Server tier tests executed — every test here is Docker-gated, so a skip on this runner means Docker broke mid-run."
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 1 week
    name: sqlserver-tier-diagnostics
    paths:
      - sqlserver-container-logs/
      - sqlserver-test-results/
    reports:
      junit: sqlserver-test-results/sqlserver.trx

# ---------------------------------------------------------------------------
# frontend
# ---------------------------------------------------------------------------
frontend:
  stage: test
  image: $NODE_IMAGE
  timeout: 20m
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    # .nvmrc is the single source of truth for the Node major. A GitLab image
    # tag cannot be read from a file, so this asserts the two still agree
    # instead of letting them drift apart unnoticed.
    - |
      want=$(tr -d ' \r\n' < .nvmrc)
      have=$(node -p "process.versions.node.split('.')[0]")
      if [ "$want" != "$have" ]; then
        echo "ERROR: .nvmrc asks for Node $want but this job runs Node $have."
        echo "Update NODE_IMAGE in .gitlab-ci.yml to match .nvmrc."
        exit 1
      fi
    - cd web
    - npm ci --cache .npm --prefer-offline
    # The typed GraphQL client is generated, not committed: codegen reads
    # ../schema.graphql, which the backend's schema-drift test keeps in lockstep
    # with the code-first schema. Skipping it is why a fresh checkout cannot
    # compile.
    - npm run codegen
    - npm run lint
    - npm run build
    - npx vitest run
    # Same reasoning as the converted-markdown corpus, for heading anchors. The
    # anchor algorithm is a cross-language contract (design.md §9): the server
    # ports it rather than reimplementing, and this corpus holds both sides to
    # the same answers.
    - cd "$CI_PROJECT_DIR"
    - |
      if [ -n "$(git status --porcelain tests/fixtures/heading-anchors)" ]; then
        echo "ERROR: tests/fixtures/heading-anchors changed when the tests regenerated it."
        echo "headingAnchors.ts no longer produces the committed anchors."
        echo "Review the diff, then commit it if the change is intended:"
        git --no-pager diff -- tests/fixtures/heading-anchors
        exit 1
      fi

# ---------------------------------------------------------------------------
# helm — lint is not enough. Adding a third FileStorage provider once exposed an
# `else` treating "not S3" as "FileSystem": lints clean, renders the wrong env
# var. So this renders every provider and asserts what each emits, plus the
# failure modes the chart promises.
# ---------------------------------------------------------------------------
helm:
  stage: test
  image: alpine/helm:3.16.3
  <<: *docker_dind
  timeout: 10m
  before_script:
    - apk add --no-cache bash git docker-cli
  script:
    - helm lint --strict deploy/helm/rocketwiki

    - |
      set -euo pipefail
      chart=deploy/helm/rocketwiki
      # api.instanceId is required (design.md §12) and web.oidcAuthority is too:
      # it is the realm the web image was BUILT against, and the CSP's
      # connect-src is derived from it. Every render supplies both, which is
      # itself the point — see the failure cases below.
      req="--set api.instanceId=ci-instance --set web.oidcAuthority=https://keycloak.ci/realms/rw"

      s3=$(helm template rw "$chart" $req --set api.fileStorage.provider=S3)
      grep -q 'FileStorage__S3__Bucket' <<<"$s3"
      ! grep -q 'FileStorage__FileSystem__Root' <<<"$s3"

      fs=$(helm template rw "$chart" $req --set api.fileStorage.provider=FileSystem \
             --set api.fileStorage.fileSystem.existingClaim=ci-pvc)
      grep -q 'FileStorage__FileSystem__Root' <<<"$fs"
      grep -q 'claimName: "ci-pvc"' <<<"$fs"

      # Blobs in the database: no S3 env, no FileSystem env, and no volume at
      # all — needing neither an object store nor a PVC is the point.
      sql=$(helm template rw "$chart" $req --set api.fileStorage.provider=SqlServer)
      grep -q 'value: "SqlServer"' <<<"$sql"
      ! grep -q 'FileStorage__S3__' <<<"$sql"
      ! grep -q 'FileStorage__FileSystem__Root' <<<"$sql"
      ! grep -q 'persistentVolumeClaim' <<<"$sql"

    - |
      set -euo pipefail
      chart=deploy/helm/rocketwiki
      # Two real defects a render can see perfectly well: four route prefixes
      # once answered the SPA's index.html in production, and an empty
      # instanceId silently made every replicated space writable.
      rendered=$(helm template rw "$chart" --set api.instanceId=ci-instance \
                   --set web.oidcAuthority=https://keycloak.ci/realms/rw)

      for path in /graphql /hubs /attachments /mcp /avatars /avatar /emojis /users; do
        grep -q "path: $path\$" <<<"$rendered" \
          || { echo "ERROR: ingress renders no route for $path"; exit 1; }
      done

      grep -q 'name: Instance__Id' <<<"$rendered"
      grep -q 'value: "ci-instance"' <<<"$rendered"

      # CSP connect-src is DERIVED from web.oidcAuthority's ORIGIN — scheme and
      # host, never the realm path, which CSP treats as a path prefix nobody
      # requests and so matches nothing. Drift here breaks sign-in at the first
      # discovery fetch, with a console error and no server-side trace.
      grep -q "value: \"'self' https://keycloak.ci\"" <<<"$rendered" \
        || { echo "ERROR: CSP_CONNECT_SRC was not derived from web.oidcAuthority's origin"; exit 1; }
      grep -q 'name: CSP_FRAME_SRC' <<<"$rendered"

    - |
      set -euo pipefail
      chart=deploy/helm/rocketwiki
      req="--set api.instanceId=ci-instance --set web.oidcAuthority=https://keycloak.ci/realms/rw"

      # FileSystem without a PVC: the chart refuses rather than creating storage
      # for state (design.md §15).
      if helm template rw "$chart" $req --set api.fileStorage.provider=FileSystem >/dev/null 2>&1; then
        echo "ERROR: provider=FileSystem with no existingClaim should have failed to render."
        exit 1
      fi

      # values.schema.json must reject an unknown provider, matching
      # AddFileStorage's fail-closed switch.
      if helm template rw "$chart" $req --set api.fileStorage.provider=Nonsense >/dev/null 2>&1; then
        echo "ERROR: An unrecognized FileStorage provider should have failed schema validation."
        exit 1
      fi

      # design.md §12: the instance identity cannot be blanked back out. An empty
      # value used to omit the env var entirely and let the app's "standalone"
      # fallback apply invisibly — which is how a low/high pair ends up sharing
      # an identity and every mirrored space becomes writable on the high side.
      if helm template rw "$chart" --set api.instanceId= >/dev/null 2>&1; then
        echo "ERROR: An empty api.instanceId should have failed schema validation."
        exit 1
      fi

      # BOTH ends refuse an unusable OIDC authority: the Dockerfile will not
      # build an image without one, and the chart will not render a deployment
      # that does not state one. Omitted, empty and scheme-less all produce the
      # same unusable result, so all three are refused.
      for bad in "" "keycloak.internal" "ftp://keycloak.internal"; do
        if helm template rw "$chart" --set api.instanceId=ci-instance \
             --set "web.oidcAuthority=$bad" >/dev/null 2>&1; then
          echo "ERROR: web.oidcAuthority='$bad' should have failed schema validation."
          exit 1
        fi
      done

      # An empty frame-src would render `frame-src ;` — the same as 'none', but
      # by accident rather than by decision.
      if helm template rw "$chart" $req --set web.csp.frameSrc= >/dev/null 2>&1; then
        echo "ERROR: An empty web.csp.frameSrc should have failed schema validation."
        exit 1
      fi

      # web.oidcAuthority's default is a PLACEHOLDER on the reserved .invalid
      # TLD, not a fallback: it cannot resolve, so an untouched value cannot
      # accidentally work. The install NOTES must say so loudly, and must stop
      # saying so once a real value is set.
      notes=$(helm install --dry-run --generate-name "$chart" --set api.instanceId=ci-instance)
      grep -q 'IS STILL THE PLACEHOLDER' <<<"$notes" \
        || { echo "ERROR: NOTES must flag the untouched web.oidcAuthority placeholder"; exit 1; }

      notes=$(helm install --dry-run --generate-name "$chart" $req)
      ! grep -q 'IS STILL THE PLACEHOLDER' <<<"$notes" \
        || { echo "ERROR: NOTES still flags a placeholder after web.oidcAuthority was set"; exit 1; }

    # The web image's build-arg guard, for the cost of one alpine layer:
    # `--target oidc-authority-check` stops before npm ci and the Vite build, so
    # this is seconds rather than minutes.
    - |
      set -euo pipefail
      for bad in "" "keycloak.internal" "ftp://keycloak.internal"; do
        if docker build -f Dockerfile.web --target oidc-authority-check \
             ${bad:+--build-arg "VITE_OIDC_AUTHORITY=$bad"} . >/dev/null 2>&1; then
          echo "ERROR: Dockerfile.web built with VITE_OIDC_AUTHORITY='$bad'; it must refuse."
          exit 1
        fi
      done

      # The two accepted shapes: a real authority, and the explicit, named
      # opt-out for building a deliberately-unusable smoke-test image.
      docker build -f Dockerfile.web --target oidc-authority-check \
        --build-arg VITE_OIDC_AUTHORITY=https://keycloak.ci/realms/rw . >/dev/null
      docker build -f Dockerfile.web --target oidc-authority-check \
        --build-arg ALLOW_UNCONFIGURED_OIDC=1 . >/dev/null

# ---------------------------------------------------------------------------
# a11y — the browser accessibility tier (docs/ACCESSIBILITY.md). The frontend
# job's vitest run already includes the jsdom axe layer (fast, structural,
# contrast excluded); THIS is the layer that needs a real browser: every major
# screen captured in both themes, then axe-core in Chromium with the full
# WCAG 2.2 AA tag set, so colour-contrast and target-size are enforced against
# real layout and painted pixels. It also carries the print tier, which reads
# the produced PDF's own text.
# ---------------------------------------------------------------------------
a11y:
  stage: test
  # Playwright's own image: the browser and its OS libraries are already there,
  # which replaces GitHub's cache-then-install-deps dance. The tag must match
  # the @playwright/test version in web/a11y/package.json; the guard below
  # fails loudly if they drift rather than silently testing on the wrong build.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  timeout: 30m
  cache:
    key:
      files:
        - web/package-lock.json
        - web/a11y/package-lock.json
    paths:
      - web/.npm/
      - web/a11y/.npm/
  script:
    - |
      want=$(node -p "require('./web/a11y/package.json').devDependencies['@playwright/test'].replace(/[^0-9.]/g,'')")
      have=$(node -p "require('/ms-playwright-agent/node_modules/@playwright/test/package.json').version" 2>/dev/null || echo unknown)
      echo "playwright: package.json wants $want, image provides $have"
      if [ "$have" != "unknown" ] && [ "$want" != "$have" ]; then
        echo "ERROR: the Playwright image tag and web/a11y/package.json disagree."
        echo "Update the a11y job's image to mcr.microsoft.com/playwright:v$want-noble."
        exit 1
      fi
    - cd web
    - npm ci --cache .npm --prefer-offline
    # Generated GraphQL client — same reasoning as the frontend job.
    - npm run codegen
    - PREVIEW_OUT="$CI_PROJECT_DIR/web/a11y/screens" npx vitest run src/preview/a11yScreens.test.tsx
    # Playwright lives in its own package so the SPA's npm ci never pays for the
    # browser toolchain.
    - cd a11y
    - npm ci --cache .npm --prefer-offline
    - npx playwright test
  artifacts:
    when: on_failure
    expire_in: 1 week
    name: a11y-violations-report
    paths:
      - web/a11y/report/
      - web/a11y/test-results/
      - web/a11y/screens/
