name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build RocketWiki.sln --configuration Release
      # RocketWiki.SqlServer.Tests is excluded HERE only because it has its own job
      # below ("sqlserver"), whose skip-guard asserts every one of its tests actually
      # executed - running it twice would double the container work per push while
      # adding no coverage. This job stays the container-free tier: its green run is
      # what proves the EF model and LINQ remain provider-agnostic (design.md §14).
      - run: dotnet test RocketWiki.sln --configuration Release --no-build --filter "FullyQualifiedName!~RocketWiki.SqlServer.Tests"

      # The converted-markdown corpus is regenerated by the importer's test run.
      # Regenerating proves it matches the converter's *current* behaviour; only
      # this check proves the committed files match too. See design.md §13.
      - name: Fail if the converted-markdown corpus drifted
        run: |
          if [ -n "$(git status --porcelain tests/fixtures/converted-markdown)" ]; then
            echo "::error::tests/fixtures/converted-markdown changed when the tests regenerated it."
            echo "The Confluence converter's output no longer matches the committed corpus."
            echo "Review the diff, then commit it if the change is intended:"
            git --no-pager diff -- tests/fixtures/converted-markdown
            exit 1
          fi

  # design.md §14 tier 3: the SQL Server (Testcontainers) suite. This is the tier's
  # FIRST-CLASS home - on developer machines without Docker the whole project skips
  # (visibly, via [SqlServerFact]); here it must actually run, and the "fail if it
  # skipped" step below turns any silent skip (= Docker broke on the runner) into a
  # red build, because a skipped tier that stays green is a tier that doesn't exist.
  sqlserver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The FTS-enabled image (stock mssql/server has no Full-Text Search and the
      # InitialCreate migration's FULLTEXT DDL hard-fails without it). Built as an
      # explicit step - not left to the test fixture - so an apt/repo breakage fails
      # HERE with a readable docker build log. buildx + the gha cache (mode=max, so
      # the ~1.5 GB base layers are cached too) makes warm runs skip both the MCR
      # pull and the apt install, and insulates the job from packages.microsoft.com
      # outages; actions/cache with docker save/load would move the same gigabytes
      # with hand-rolled invalidation. `load: true` puts the image in the local
      # daemon, where the ROCKETWIKI_MSSQL_FTS_IMAGE env below hands it to the
      # tests. If either the env or this step were ever lost, the fixture would
      # build the same Dockerfile itself - slower, never silently skipped.
      - uses: docker/setup-buildx-action@v3
      - name: Build FTS-enabled SQL Server image
        uses: docker/build-push-action@v6
        with:
          context: tests/RocketWiki.SqlServer.Tests/mssql-fts
          tags: rocketwiki-mssql-fts:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: dotnet build tests/RocketWiki.SqlServer.Tests --configuration Release

      - name: Run the SQL Server tier
        env:
          ROCKETWIKI_MSSQL_FTS_IMAGE: rocketwiki-mssql-fts:ci
          ROCKETWIKI_SQLSERVER_TEST_LOGS: ${{ github.workspace }}/sqlserver-container-logs
        run: >
          dotnet test tests/RocketWiki.SqlServer.Tests --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=sqlserver.trx"
          --results-directory sqlserver-test-results

      # `dotnet test` exits 0 when every test skips - which on this runner would mean
      # the Docker probe failed and the tier silently vanished. Read the trx counters:
      # a skipped xUnit test appears in total but not in executed (verified against a
      # locally produced trx: total="11" executed="0" for an all-skipped run), so the
      # invariant on this runner is executed == total, and executed > 0.
      - name: Fail if the tier skipped instead of running
        run: |
          trx=sqlserver-test-results/sqlserver.trx
          counters=$(grep -o '<Counters [^/]*/>' "$trx")
          echo "$counters"
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
          executed=$(echo "$counters" | grep -o 'executed="[0-9]*"' | grep -o '[0-9]*')
          if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
            echo "::error::The SQL Server tier executed zero tests - Docker on the runner is broken, and the tier's coverage silently disappeared."
            exit 1
          fi
          if [ "$executed" -ne "$total" ]; then
            echo "::error::Only $executed of $total SQL Server tier tests executed - every test here is Docker-gated, so a skip on this runner means Docker broke mid-run."
            exit 1
          fi

      # The engine's own stdout/stderr (written by SqlServerContainerFixture before
      # it disposes the container) plus the trx - the only way to debug an FTS
      # population or engine-boot failure after the container is gone.
      - name: Upload SQL Server container logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sqlserver-tier-diagnostics
          path: |
            sqlserver-container-logs/
            sqlserver-test-results/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The typed GraphQL client is generated, not committed (web/.gitignore):
      # codegen reads ../schema.graphql, which the backend's schema-drift test
      # keeps in lockstep with the code-first schema — so this step is
      # deterministic, and skipping it is why a fresh checkout can't compile.
      - run: npm run codegen
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

      # Same reasoning as above, for the heading-anchor corpus. The anchor
      # algorithm is a cross-language contract (design.md §9): the server ports
      # it rather than reimplementing, and this corpus is what holds both sides
      # to the same answers.
      - name: Fail if the heading-anchor corpus drifted
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain tests/fixtures/heading-anchors)" ]; then
            echo "::error::tests/fixtures/heading-anchors changed when the tests regenerated it."
            echo "headingAnchors.ts no longer produces the committed anchors."
            echo "Review the diff, then commit it if the change is intended:"
            git --no-pager diff -- tests/fixtures/heading-anchors
            exit 1
          fi
