name: CI

on:
  push:
  pull_request:

# Least privilege: every job here only reads the repo. Nothing publishes,
# comments, or writes releases — so no job needs more than this, and a
# compromised action in the graph can't use the token to change anything.
permissions:
  contents: read

# A push that supersedes an in-flight run cancels it. The sqlserver job pulls
# and boots a real SQL Server per run, so stacking runs on rapid pushes is the
# expensive kind of waste. (Docs deploys deliberately queue instead — see
# docs.yml, where cancelling a half-finished Pages deploy would be worse.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # Generous vs the ~4 min this takes, tight vs the 6-hour default: the
    # failure mode worth bounding is a hang, not a slow run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build RocketWiki.sln --configuration Release
      # RocketWiki.SqlServer.Tests is excluded HERE only because it has its own job
      # below ("sqlserver"), whose skip-guard asserts every one of its tests actually
      # executed - running it twice would double the container work per push while
      # adding no coverage. This job stays the container-free tier: its green run is
      # what proves the EF model and LINQ remain provider-agnostic (design.md §14).
      - run: dotnet test RocketWiki.sln --configuration Release --no-build --filter "FullyQualifiedName!~RocketWiki.SqlServer.Tests"

      # The converted-markdown corpus is regenerated by the importer's test run.
      # Regenerating proves it matches the converter's *current* behaviour; only
      # this check proves the committed files match too. See design.md §13.
      - name: Fail if the converted-markdown corpus drifted
        run: |
          if [ -n "$(git status --porcelain tests/fixtures/converted-markdown)" ]; then
            echo "::error::tests/fixtures/converted-markdown changed when the tests regenerated it."
            echo "The Confluence converter's output no longer matches the committed corpus."
            echo "Review the diff, then commit it if the change is intended:"
            git --no-pager diff -- tests/fixtures/converted-markdown
            exit 1
          fi

  # design.md §14 tier 3: the SQL Server (Testcontainers) suite. This is the tier's
  # FIRST-CLASS home - on developer machines without Docker the whole project skips
  # (visibly, via [SqlServerFact]); here it must actually run, and the "fail if it
  # skipped" step below turns any silent skip (= Docker broke on the runner) into a
  # red build, because a skipped tier that stays green is a tier that doesn't exist.
  sqlserver:
    # ubuntu-22.04, deliberately not -latest: on 2026-08-23 the byte-identical
    # FTS image (digest-pinned) ran green seven times on the 24.04 pool, then
    # crashed at engine boot four times in a row from ~18:00 UTC (SQLPAL fatal in
    # lsass init, errno 11 EAGAIN) with no change in image, runner-image release,
    # or code - the signature of a host-pool rollout SQLPAL dislikes. The 22.04
    # pool is the isolation experiment; revisit when the mssql-docker 2025 boot
    # issues settle (see microsoft/mssql-docker#936/#940 for the genre).
    runs-on: ubuntu-22.04
    # The longest job by far (image build + engine boot + migrations); the
    # engine-boot crashes documented above hang rather than fail fast.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The FTS-enabled image (stock mssql/server has no Full-Text Search and the
      # InitialCreate migration's FULLTEXT DDL hard-fails without it). Built as an
      # explicit step - not left to the test fixture - so an apt/repo breakage fails
      # HERE with a readable docker build log. buildx + the gha cache (mode=max, so
      # the ~1.5 GB base layers are cached too) makes warm runs skip both the MCR
      # pull and the apt install, and insulates the job from packages.microsoft.com
      # outages; actions/cache with docker save/load would move the same gigabytes
      # with hand-rolled invalidation. `load: true` puts the image in the local
      # daemon, where the ROCKETWIKI_MSSQL_FTS_IMAGE env below hands it to the
      # tests. If either the env or this step were ever lost, the fixture would
      # build the same Dockerfile itself - slower, never silently skipped.
      - uses: docker/setup-buildx-action@v4
      - name: Build FTS-enabled SQL Server image
        uses: docker/build-push-action@v7
        with:
          context: docker/mssql-fts
          tags: rocketwiki-mssql-fts:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: dotnet build tests/RocketWiki.SqlServer.Tests --configuration Release

      - name: Run the SQL Server tier
        env:
          ROCKETWIKI_MSSQL_FTS_IMAGE: rocketwiki-mssql-fts:ci
          ROCKETWIKI_SQLSERVER_TEST_LOGS: ${{ github.workspace }}/sqlserver-container-logs
        run: >
          dotnet test tests/RocketWiki.SqlServer.Tests --configuration Release --no-build
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=sqlserver.trx"
          --results-directory sqlserver-test-results

      # `dotnet test` exits 0 when every test skips - which on this runner would mean
      # the Docker probe failed and the tier silently vanished. Read the trx counters:
      # a skipped xUnit test appears in total but not in executed (verified against a
      # locally produced trx: total="11" executed="0" for an all-skipped run), so the
      # invariant on this runner is executed == total, and executed > 0.
      - name: Fail if the tier skipped instead of running
        run: |
          trx=sqlserver-test-results/sqlserver.trx
          counters=$(grep -o '<Counters [^/]*/>' "$trx")
          echo "$counters"
          total=$(echo "$counters" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
          executed=$(echo "$counters" | grep -o 'executed="[0-9]*"' | grep -o '[0-9]*')
          if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
            echo "::error::The SQL Server tier executed zero tests - Docker on the runner is broken, and the tier's coverage silently disappeared."
            exit 1
          fi
          if [ "$executed" -ne "$total" ]; then
            echo "::error::Only $executed of $total SQL Server tier tests executed - every test here is Docker-gated, so a skip on this runner means Docker broke mid-run."
            exit 1
          fi

      # The engine's own stdout/stderr (written by SqlServerContainerFixture before
      # it disposes the container) plus the trx - the only way to debug an FTS
      # population or engine-boot failure after the container is gone.
      - name: Upload SQL Server container logs and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sqlserver-tier-diagnostics
          path: |
            sqlserver-container-logs/
            sqlserver-test-results/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth for the Node major (it was
          # previously repeated in three workflow blocks and nowhere else).
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The typed GraphQL client is generated, not committed (web/.gitignore):
      # codegen reads ../schema.graphql, which the backend's schema-drift test
      # keeps in lockstep with the code-first schema — so this step is
      # deterministic, and skipping it is why a fresh checkout can't compile.
      - run: npm run codegen
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

      # Same reasoning as above, for the heading-anchor corpus. The anchor
      # algorithm is a cross-language contract (design.md §9): the server ports
      # it rather than reimplementing, and this corpus is what holds both sides
      # to the same answers.
      - name: Fail if the heading-anchor corpus drifted
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain tests/fixtures/heading-anchors)" ]; then
            echo "::error::tests/fixtures/heading-anchors changed when the tests regenerated it."
            echo "headingAnchors.ts no longer produces the committed anchors."
            echo "Review the diff, then commit it if the change is intended:"
            git --no-pager diff -- tests/fixtures/heading-anchors
            exit 1
          fi

  # The Helm chart (deploy/helm/rocketwiki). DEVELOPING.md has told people to
  # run `helm lint --strict` after touching the chart since it was written;
  # nothing enforced it, and a chart is exactly the artifact whose breakage
  # surfaces at 3am on a cluster rather than in a test. Lint alone is not
  # enough either: adding a third FileStorage provider exposed an `else` that
  # had been treating "not S3" as "FileSystem", which lints clean and renders
  # the wrong env var — so this job also RENDERS every provider and asserts
  # what each one emits, plus the two failure modes the chart promises.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint (strict)
        run: helm lint --strict deploy/helm/rocketwiki

      - name: Render every storage provider
        run: |
          set -euo pipefail
          chart=deploy/helm/rocketwiki
          # api.instanceId is required (design.md §12) — every render below has to
          # supply it, which is itself the point: see the failure case further down.
          req="--set api.instanceId=ci-instance"

          s3=$(helm template rw "$chart" $req --set api.fileStorage.provider=S3)
          grep -q 'FileStorage__S3__Bucket' <<<"$s3"
          ! grep -q 'FileStorage__FileSystem__Root' <<<"$s3"

          fs=$(helm template rw "$chart" $req --set api.fileStorage.provider=FileSystem \
                 --set api.fileStorage.fileSystem.existingClaim=ci-pvc)
          grep -q 'FileStorage__FileSystem__Root' <<<"$fs"
          grep -q 'claimName: "ci-pvc"' <<<"$fs"

          # Blobs in the database: no S3 env, no FileSystem env, and no volume
          # at all — needing neither an object store nor a PVC is the point.
          sql=$(helm template rw "$chart" $req --set api.fileStorage.provider=SqlServer)
          grep -q 'value: "SqlServer"' <<<"$sql"
          ! grep -q 'FileStorage__S3__' <<<"$sql"
          ! grep -q 'FileStorage__FileSystem__Root' <<<"$sql"
          ! grep -q 'persistentVolumeClaim' <<<"$sql"

      # The lint+render job existed and still missed two things a render can see
      # perfectly well: which paths reach the API, and whether the instance
      # identity actually made it into the container. Both were real defects —
      # four route prefixes answered the SPA's index.html in production, and an
      # empty instanceId silently made every replicated space writable.
      - name: The API's route surface and instance identity must survive a render
        run: |
          set -euo pipefail
          chart=deploy/helm/rocketwiki
          rendered=$(helm template rw "$chart" --set api.instanceId=ci-instance)

          # Every prefix the SPA calls same-origin must route to the API Service.
          # ApiRouteSurfaceTests pins this list against web/vite.config.ts; this
          # step is the same assertion against actually-rendered YAML.
          for path in /graphql /hubs /attachments /mcp /avatars /avatar /emojis /users; do
            grep -q "path: $path\$" <<<"$rendered" \
              || { echo "::error::ingress renders no route for $path"; exit 1; }
          done

          # design.md §12: the identity has to reach the container, not just the
          # values file. An omitted env var is what let both sides default to
          # "standalone" and made imported spaces writable.
          grep -q 'name: Instance__Id' <<<"$rendered"
          grep -q 'value: "ci-instance"' <<<"$rendered"

      - name: The chart's promised failures must actually fail
        run: |
          set -euo pipefail
          chart=deploy/helm/rocketwiki

          req="--set api.instanceId=ci-instance"

          # FileSystem without a PVC: the chart refuses rather than creating
          # storage for state (design.md §15).
          if helm template rw "$chart" $req --set api.fileStorage.provider=FileSystem >/dev/null 2>&1; then
            echo "::error::provider=FileSystem with no existingClaim should have failed to render."
            exit 1
          fi

          # values.schema.json must reject an unknown provider, matching
          # AddFileStorage's fail-closed switch.
          if helm template rw "$chart" $req --set api.fileStorage.provider=Nonsense >/dev/null 2>&1; then
            echo "::error::An unrecognized FileStorage provider should have failed schema validation."
            exit 1
          fi

          # design.md §12: the instance identity cannot be blanked back out. An empty
          # value used to omit the env var entirely and let the app's "standalone"
          # fallback apply invisibly — which is how a low/high pair ends up sharing an
          # identity and every mirrored space becomes writable on the high side.
          if helm template rw "$chart" --set api.instanceId= >/dev/null 2>&1; then
            echo "::error::An empty api.instanceId should have failed schema validation."
            exit 1
          fi

  # The browser accessibility tier (docs/ACCESSIBILITY.md). The `frontend`
  # job's vitest run already includes the jsdom axe layer (fast, structural,
  # contrast excluded); THIS job is the layer that needs a real browser:
  # render every major screen in both themes to standalone HTML (the
  # a11yScreens capture harness), then run axe-core in Chromium with the full
  # WCAG 2.2 AA tag set — color-contrast and target-size enforced against
  # real layout and painted pixels. Fails on any violation; the JSON/HTML
  # report is uploaded as an artifact on failure.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/a11y/package-lock.json
      - run: npm ci
        working-directory: web
      # Generated GraphQL client — same reasoning as the frontend job.
      - run: npm run codegen
        working-directory: web
      - name: Generate the accessibility capture set (both themes)
        run: PREVIEW_OUT="$GITHUB_WORKSPACE/web/a11y/screens" npx vitest run src/preview/a11yScreens.test.tsx
        working-directory: web
      # Playwright lives in its own package (web/a11y) so the SPA's npm ci
      # never pays for the browser toolchain.
      - run: npm ci
        working-directory: web/a11y
      - name: Resolve Playwright version for the browser cache key
        id: playwright-version
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
        working-directory: web/a11y
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Playwright's own recommended cache split: download the browser only
      # on a cache miss, but ALWAYS ensure the OS shared libraries — a cached
      # browser on a fresh runner still needs them.
      - name: Install Chromium (browser + OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: web/a11y
      - name: Install Chromium OS deps (browser restored from cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: web/a11y
      - name: Run axe (WCAG 2.2 AA, both themes) over the capture set
        run: npx playwright test
        working-directory: web/a11y
      - name: Upload violations report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-violations-report
          path: |
            web/a11y/report/
            web/a11y/test-results/
            web/a11y/screens/
          if-no-files-found: ignore
