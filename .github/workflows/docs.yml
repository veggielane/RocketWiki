# Builds and VALIDATES the documentation site (docs-site/). It no longer deploys
# anywhere: publishing to GitHub Pages was removed deliberately, because the site
# was public while the repository is private, and this project's docs describe a
# system that holds classified content.
#
# The workflow is kept rather than deleted because the deploy was never the only
# thing it did. `npm run check` fails on a broken §-reference or a missing source
# document, and nothing in ci.yml does that — deleting the file would have quietly
# retired the only guard design.md has against its own cross-references rotting.
#
# The site is GENERATED from the canonical repo docs at build time
# (docs-site/scripts/generate.mjs) — hence the paths filter covers the
# generation inputs, not just docs-site/ itself: the root *.md documents
# (design.md, README.md, DEVELOPING.md, data-model.md), deploy/, and the
# Keycloak realm README.
#
# Still separate from ci.yml: it triggers on a different set of paths (the
# generation inputs above), so folding it in would run the whole test suite every
# time a paragraph of design.md changed.
name: Docs (build and check only — no deploy)

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '*.md'
      - 'deploy/**'
      - 'src/RocketWiki.AppHost/keycloak/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Read-only. The Pages write and id-token permissions were removed with the deploy
# job: a workflow that cannot publish should not hold the credential to.
permissions:
  contents: read

# Superseded runs are cancelled now that nothing is being deployed — there is no
# in-flight production deploy left to queue behind.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
      - name: Generator unit tests
        run: npm test
      - name: Validate content generation (fails on missing sources or broken links)
        run: npm run check
      - name: Build site
        run: npm run build
      # The build still runs: it is what proves the generated site compiles at all,
      # and a check that only parsed the sources would miss a template that does not.
      # The artifact is simply not uploaded anywhere.
