# The candidate-parent tree for the move dialog. Real recursion isn't
# possible in GraphQL, so this goes a few levels deeper than casual nav
# needs; fine for typical wiki nesting depth.
#
# `ownViewRestrictions` is a LIST of {ruleId, expressionJson} — a page can
# carry several view restrictions. flattenMoveTargets accumulates them
# down the tree (restrictions are positional and accumulate, design.md
# §6.4) so the dialog can warn when a move would change who can see the
# page.
query SpaceTreeForMove($spaceId: UUID!) {
  pageTree(spaceId: $spaceId) {
    ...MoveTreeNode
    children {
      ...MoveTreeNode
      children {
        ...MoveTreeNode
        children {
          ...MoveTreeNode
        }
      }
    }
  }
}

fragment MoveTreeNode on PageTreeNode {
  id
  title
  sortOrder
  ownViewRestrictions {
    ruleId
    expressionJson
  }
}
