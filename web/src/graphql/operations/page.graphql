# The page read shared by the view and edit routes. The viewer-permission
# fields (canEdit/canComment/canManageAccess) are server-computed, batched,
# and replica-aware (design.md §8 "Known deltas") — the UI hides affordances
# the server would refuse rather than offering-and-refusing, while the
# server stays the enforcement point (§6.7). `viewerIsWatching` is the
# server truth behind the watch toggle; `labelDetails` carries the label
# ids that attach/detach need; `author`/`uploadedBy` are UserRef
# display-name resolutions.
query PageById($id: UUID!) {
  page(id: $id) {
    id
    spaceId
    spaceKey
    title
    slug
    content
    currentRevisionNumber
    canEdit
    canComment
    canManageAccess
    viewerIsWatching
    labels
    labelDetails {
      id
      spaceId
      name
    }
    parent {
      id
      title
    }
    children {
      id
    }
    comments {
      id
      parentCommentId
      body
      isDeleted
      authorUserId
      author {
        id
        displayName
      }
      createdAtUtc
      editedAtUtc
    }
    attachments {
      id
      fileName
      contentType
      sizeBytes
      uploadedBy {
        id
        displayName
      }
    }
  }
}

mutation UpdatePageContent($input: UpdatePageContentRequestInput!) {
  updatePageContent(input: $input) {
    page {
      id
      title
      content
      currentRevisionNumber
    }
    error {
      ...MutationError
    }
  }
}
