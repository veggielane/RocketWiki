# The page read shared by the view and edit routes. The viewer-permission
# fields (canEdit/canComment/canManageAccess) are server-computed, batched,
# and replica-aware (design.md §8 "Known deltas") — the UI hides affordances
# the server would refuse rather than offering-and-refusing, while the
# server stays the enforcement point (§6.7). `viewerIsWatching` is the
# server truth behind the watch toggle; `labelDetails` carries the label
# ids that attach/detach need; `author`/`uploadedBy` are UserRef
# display-name resolutions.
query PageById($id: UUID!) {
  page(id: $id) {
    id
    spaceId
    spaceKey
    title
    slug
    content
    currentRevisionNumber
    canEdit
    canComment
    canManageAccess
    viewerIsWatching
    labels
    labelDetails {
      id
      spaceId
      name
    }
    # design.md §20: the page view's read-only properties panel. Carried on
    # this read rather than fetched separately because the values are a
    # handful of short strings resolved through the same DataLoader batch,
    # and the panel renders with the header — a second round trip would make
    # it pop in after the page it belongs to.
    properties {
      keyId
      key
      value
      sortOrder
    }
    parent {
      id
      title
    }
    children {
      id
    }
    comments {
      id
      parentCommentId
      body
      isDeleted
      authorUserId
      author {
        id
        displayName
        hasAvatar
      }
      createdAtUtc
      editedAtUtc
    }
    attachments {
      id
      fileName
      contentType
      sizeBytes
      uploadedBy {
        id
        displayName
        hasAvatar
      }
    }
  }
}

mutation UpdatePageContent($input: UpdatePageContentRequestInput!) {
  updatePageContent(input: $input) {
    page {
      id
      title
      content
      currentRevisionNumber
    }
    error {
      ...MutationError
    }
  }
}

# The same mutation, selected for a collaborative-session save (design.md
# §8): revisions come back with `contributors` — the server-resolved
# PageRevisionContributor rows the session credited (never client-supplied)
# — so the post-save toast can name everyone whose live edits the saved
# revision carries. A separate document from UpdatePageContent on purpose:
# solo saves shouldn't pay for the revision-list selection, and the cost is
# honest to note — `revisions` has no pagination, so this reselects every
# revision's number + contributors on each session save.
mutation UpdatePageContentInSession($input: UpdatePageContentRequestInput!) {
  updatePageContent(input: $input) {
    page {
      id
      title
      content
      currentRevisionNumber
      revisions {
        id
        revisionNumber
        contributors {
          id
          displayName
          hasAvatar
        }
      }
    }
    error {
      ...MutationError
    }
  }
}
