# NOTE (schema reconciliation): the real Page type exposes no
# viewer-permission fields — no canEdit/canComment/canManageAccess, no
# `restrictions` summary. Until the API grows them (reported as a contract
# gap; design.md §8's sketch includes `restrictions` and an effective-
# permission inspector), the UI cannot hide edit affordances per user — it
# offers them and renders the server's typed refusal (`error.kind ===
# "Forbidden"`) gracefully instead.
query PageById($id: UUID!) {
  page(id: $id) {
    id
    spaceId
    spaceKey
    title
    slug
    content
    currentRevisionNumber
    labels
    parent {
      id
      title
    }
    children {
      id
    }
    comments {
      id
      parentCommentId
      body
      isDeleted
      authorUserId
      createdAtUtc
      editedAtUtc
    }
    attachments {
      id
      fileName
      contentType
      sizeBytes
      uploadedByUserId
    }
  }
}

mutation UpdatePageContent($input: UpdatePageContentRequestInput!) {
  updatePageContent(input: $input) {
    page {
      id
      title
      content
      currentRevisionNumber
    }
    error {
      ...MutationError
    }
  }
}
