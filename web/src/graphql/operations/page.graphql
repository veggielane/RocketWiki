# Everything the page view and edit routes read about a page. The
# viewer-permission fields (canEdit/canComment/canManageAccess) are
# server-computed, batched, and replica-aware (design.md §8 "Known deltas")
# — the UI hides affordances the server would refuse rather than
# offering-and-refusing, while the server stays the enforcement point
# (§6.7). `viewerIsWatching` is the server truth behind the watch toggle;
# `labelDetails` carries the label ids that attach/detach need;
# `author`/`uploadedBy` are UserRef display-name resolutions.
#
# A fragment rather than a query body so the two ways of reading a page —
# the plain `page(id)` the editor uses and the disclosing `pageAccess(id)` the
# view uses — select the same page the same way, and cannot drift into two
# page shapes.
fragment PageCore on Page {
  id
  spaceId
  spaceKey
  title
  slug
  icon
  content
  currentRevisionNumber
  canEdit
  canComment
  canManageAccess
  viewerIsWatching
  labels
  labelDetails {
    id
    spaceId
    name
  }
  # design.md §20: the page view's read-only properties panel. Carried on
  # this read rather than fetched separately because the values are a
  # handful of short strings resolved through the same DataLoader batch,
  # and the panel renders with the header — a second round trip would make
  # it pop in after the page it belongs to.
  properties {
    keyId
    key
    value
    sortOrder
  }
  # design.md §21: the marking gates who may read this page, so it rides on
  # the page read itself rather than a second round trip — a banner that
  # popped in after the content would show the page unmarked for a beat,
  # and the top-and-bottom convention exists precisely so the marking is
  # never missing from what a reader (or a screenshot) sees.
  marking {
    ...PageMarking
  }
  parent {
    id
    title
  }
  children {
    id
  }
  comments {
    id
    parentCommentId
    body
    isDeleted
    authorUserId
    author {
      id
      displayName
      hasAvatar
    }
    createdAtUtc
    editedAtUtc
  }
  attachments {
    id
    fileName
    contentType
    sizeBytes
    uploadedBy {
      id
      displayName
      hasAvatar
    }
  }
}

# The plain page read (the edit route, and any content-only consumer). Null
# for a page that does not exist AND for one this caller may not read —
# unchanged, and pinned byte-identical server-side, so the plain read stays
# leak-free (design.md §6.7).
query PageById($id: UUID!) {
  page(id: $id) {
    ...PageCore
  }
}

# The page VIEW's read (design.md §6.7 / §21.8): the same page, through the
# disclosing query. Exactly one of `page` and `denial` is non-null; the whole
# result is null only for a page that does not exist. A denial is a
# placeholder — marking and failing gates, never a title — which the view
# renders as the "Protected page" screen instead of pretending not to know.
# One request, one `page.view` audit row either way.
#
# Two things ride on the readable page that the plain read does not carry:
#
# `linkTargets` resolves every `page://{id}` link in THIS page's own content
# (ids extracted server-side, distinct, first-occurrence order) to a readable
# target, a denial, or neither (the page no longer exists). Nested on the
# page rather than a root field taking ids, because a root field would be an
# unaudited existence-and-marking oracle for any id you cared to type; here
# the ids come from content the caller has already been allowed to read. The
# read-only editor's link view renders each as a router link, an inert
# `(protected)` marker carrying the label, or a missing marker (editor/marks).
#
# `parentDenial` says, when `parent` is null, whether that is because the
# parent is withheld rather than absent — beside the unchanged `parent`.
fragment PageView on Page {
  ...PageCore
  parentDenial {
    ...AccessDenial
  }
  linkTargets {
    id
    page {
      id
      title
      slug
      spaceKey
    }
    denial {
      placeholderTitle
      noSpaceAccess
      marking {
        label
      }
    }
  }
}

query PageAccessById($id: UUID!) {
  pageAccess(id: $id) {
    page {
      ...PageView
    }
    denial {
      ...AccessDenial
    }
  }
}

# Just enough to answer "which space am I in?" from a page route, for the
# navigation tree. Deliberately tiny and separate from PageById: the nav needs
# this on every page view, including while the full page read is still in
# flight, and it must not re-fetch a page's comments and attachments to find
# out which space to expand.
query PageSpaceRef($id: UUID!) {
  page(id: $id) {
    id
    spaceId
    spaceKey
  }
}

# Creating a page. `parentPageId` null makes it a root page in the space;
# supplying one nests it, which is the "add child page" entry point. The
# selection is deliberately small — just enough to navigate to the new page —
# because the view route refetches it in full on arrival anyway.
mutation CreatePage($input: CreatePageRequestInput!) {
  createPage(input: $input) {
    page {
      id
      spaceId
      title
      slug
    }
    error {
      ...MutationError
    }
  }
}

mutation UpdatePageContent($input: UpdatePageContentRequestInput!) {
  updatePageContent(input: $input) {
    page {
      id
      title
      content
      currentRevisionNumber
    }
    error {
      ...MutationError
    }
  }
}

# The same mutation, selected for a collaborative-session save (design.md
# §8): revisions come back with `contributors` — the server-resolved
# PageRevisionContributor rows the session credited (never client-supplied)
# — so the post-save toast can name everyone whose live edits the saved
# revision carries. A separate document from UpdatePageContent on purpose:
# solo saves shouldn't pay for the revision-list selection, and the cost is
# honest to note — `revisions` has no pagination, so this reselects every
# revision's number + contributors on each session save.
mutation UpdatePageContentInSession($input: UpdatePageContentRequestInput!) {
  updatePageContent(input: $input) {
    page {
      id
      title
      content
      currentRevisionNumber
      revisions {
        id
        revisionNumber
        contributors {
          id
          displayName
          hasAvatar
        }
      }
    }
    error {
      ...MutationError
    }
  }
}

# The slug route: /spaces/{spaceKey}/{slug}. Resolves ONLY the id, on purpose —
# the route then renders the same PageViewPage, which does its normal read.
# Selecting the whole page here instead would fetch it twice, once to learn
# its id and again to render it.
#
# Through the disclosing query (design.md §6.7 / §21.8): a page this caller
# may not read answers a `denial`, which the route renders as the protected
# screen before any id exists to hand on; a slug nobody has answers null,
# which is the not-found notice. The slug form is a bounded space-key oracle
# — a space the caller cannot enter still answers the no-space-access
# placeholder rather than null — accepted in the design as the price of an
# honest tree.
query PageAccessBySlug($spaceKey: String!, $slug: String!) {
  pageAccessBySlug(spaceKey: $spaceKey, slug: $slug) {
    page {
      id
    }
    denial {
      ...AccessDenial
    }
  }
}

# A page's revision history (design.md §5). `author` is who pressed save —
# always present — while `contributors` is who typed, which a co-edited
# revision credits and a solo save leaves empty. The history list needs the
# one name that is always there, so it leads with the author.
#
# `content` rides along because the diff is computed client-side from two
# revisions the caller already holds. No pagination: `revisions` has none, and
# adding it here would be pretending otherwise.
query PageHistory($id: UUID!) {
  page(id: $id) {
    id
    title
    canEdit
    revisions {
      id
      revisionNumber
      title
      content
      editSummary
      createdAtUtc
      author {
        id
        displayName
        hasAvatar
      }
      contributors {
        id
        displayName
        hasAvatar
      }
    }
  }
}
