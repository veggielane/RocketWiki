# A person's profile (design.md §6.2, §8): the group memberships their claims
# carried at their last sign-in, in ordinal order — the same groups claim
# that access rules are written against. Readable by any signed-in user; null
# for an unknown id and for an anonymous caller alike, like `page`.
#
# Groups, and nothing that reads like a permission. There is no clearance and
# no selector eligibility to select: this deployment carries neither
# attribute, so a level is never compared against a person and the selector
# gate is the per-space grants alone. A profile that answered "may this
# person be shown SECRET" would be asserting a check the wiki does not make.
#
# Deliberately no nationality, email or last-seen: those stay admin-only on
# the audited roster (§6.2).
query UserProfile($id: UUID!) {
  userProfile(id: $id) {
    id
    displayName
    hasAvatar
    isExternal
    groups
  }
}
