# The real Comment type carries `authorUserId` (local User row id) only —
# no authorDisplayName resolver yet (contract gap, reported): the thread UI
# falls back to a shortened id.
mutation AddComment($input: AddCommentRequestInput!) {
  addComment(input: $input) {
    comment {
      id
      parentCommentId
      body
      isDeleted
      authorUserId
      createdAtUtc
      editedAtUtc
    }
    error {
      ...MutationError
    }
  }
}

mutation DeleteComment($input: DeleteCommentRequestInput!) {
  deleteComment(input: $input) {
    comment {
      id
      isDeleted
      body
    }
    error {
      ...MutationError
    }
  }
}
