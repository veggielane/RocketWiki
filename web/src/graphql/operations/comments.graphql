# Comment rows carry `authorUserId` (local User row id — matched against
# `CurrentUser.localUserId` for the delete-own affordance) and the
# display-name-resolving `author: UserRef`.
mutation AddComment($input: AddCommentRequestInput!) {
  addComment(input: $input) {
    comment {
      id
      parentCommentId
      body
      isDeleted
      authorUserId
      author {
        id
        displayName
        hasAvatar
      }
      createdAtUtc
      editedAtUtc
    }
    error {
      ...MutationError
    }
  }
}

mutation DeleteComment($input: DeleteCommentRequestInput!) {
  deleteComment(input: $input) {
    comment {
      id
      isDeleted
      body
    }
    error {
      ...MutationError
    }
  }
}
