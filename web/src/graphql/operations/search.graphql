query SearchPages($query: String!, $spaceKey: String, $labels: [String!], $after: String) {
  search(query: $query, spaceKey: $spaceKey, labels: $labels, after: $after) {
    # §21.13: the aggregate spans the WHOLE permission-filtered hit set — the
    # same set `totalCount` counts — not the edges of this one page, so every
    # page of the connection reports the same label and it never drops as you
    # scroll. Deliberate: a per-page aggregate would make the SPA *combine*
    # aggregates while loading more, which is the caveat-conjunction rule
    # reimplemented in TypeScript. It also means the label can out-rank
    # everything visible — a SECRET hit at position 95 correctly labels a
    # screen of OFFICIAL rows — so the UI has to say what it covers.
    aggregateMarking {
      ...AggregateMarking
    }
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        snippet
        headingPath
        anchorId
        page {
          id
          title
          spaceKey
          # design.md §21: results are already post-filtered by clearance, so
          # every hit here is one the caller may read — the level is carried
          # so a reader scanning results knows how sensitive each hit is
          # without opening it. Only `level` is used in a list (§21.4's label
          # is the page's own surface), but the fragment is the one selection
          # of PageMarkingView anywhere in the app.
          marking {
            ...PageMarking
          }
        }
      }
    }
  }
}

query SearchFacets($spaceKey: String) {
  spaces {
    key
    name
  }
  labels(spaceKey: $spaceKey)
}
