# design.md §7: admin audit viewer. Real connection shape: cursor paging
# via first/after, enum-typed filter, no totalCount. `userDisplayName` is
# nullable (system events); `channel`/`outcome`/`subjectType` are enums.
query AuditEvents($filter: AuditFilterInput!, $first: Int, $after: String) {
  auditEvents(filter: $filter, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      timestampUtc
      userId
      userDisplayName
      action
      subjectType
      subjectId
      spaceKey
      outcome
      channel
      mcpClient
      detailsJson
    }
  }
}
