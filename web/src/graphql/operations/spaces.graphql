# `Space.isReplica` + `originInstanceId` drive the proactive "Replica of
# {origin} — read-only" marking (design.md §12) on the space list,
# nav, space browser, and page view; replica-ness still also surfaces
# reactively on any write via the typed ReadOnlyReplica error.
# `viewerIsWatching` is the server truth behind the watch toggle. There is
# no per-space viewer-role field; `grants` is the server-computed admin
# signal — it returns rows only to instance/space admins ("absent, not
# forbidden") and a space always has at least one grant by construction
# (creation is atomic with its first grant), so a non-empty list means
# "this caller may manage the space".
query SpaceList {
  spaces {
    id
    key
    name
    description
    isReplica
    originInstanceId
  }
}

query SpaceTree($key: String!) {
  space(key: $key) {
    id
    key
    name
    description
    homepageId
    isReplica
    originInstanceId
    viewerIsWatching
    grants {
      id
    }
  }
}

# The page view's replica banner: the page read carries only spaceKey, so
# the space's replica flag is a second small lookup by key.
query SpaceReplicaBanner($key: String!) {
  space(key: $key) {
    id
    key
    isReplica
    originInstanceId
  }
}

# The server builds the tree to full depth (PageReadService.BuildNodeIfVisible
# recurses unbounded); this document is what truncates it, so the depth here is
# a payload decision rather than a server cost.
#
# It matters more than it used to. The nav now draws a disclosure chevron only
# when a node has children, so an unfetched level is no longer a tree that just
# looks short - it is the UI positively asserting that a page is a leaf when it
# is not. Eight levels puts that boundary past any hierarchy this wiki has, but
# it does not remove it: a genuinely deeper tree needs `hasChildren` on the node
# plus a fetch on expand, which is a schema change and its own decision.
query SpacePageTree($spaceId: UUID!) {
  pageTree(spaceId: $spaceId) {
    ...TreeNode
    children {
      ...TreeNode
      children {
        ...TreeNode
        children {
          ...TreeNode
          children {
            ...TreeNode
            children {
              ...TreeNode
              children {
                ...TreeNode
                children {
                  ...TreeNode
                }
              }
            }
          }
        }
      }
    }
  }
}

# `hasRestrictions` feeds the tree's lock badge (design.md §6.6);
# `labels` feeds the space browser's label-filter facet. Both are
# permission-filtered server-side like the tree itself.
#
# `icon` is the page's own glyph in the tree (nullable — no icon is the
# ordinary case, and the tree falls back to its generic page glyph). Selected
# on the node rather than read per page: the drawer renders the whole tree at
# once, and a lookup per row would be a query per row.
#
# `marking` is the value the tree's own pruning walk gated on (design.md
# §21.9 — GetPageTreeAsync loads every marking for the space anyway, and a
# node that displayed a marking other than the one that decided it was
# visible would be the wrong kind of wrong). The tree shows the LEVEL only:
# §21.5 prunes an over-classified node together with its whole subtree, so
# what remains is what this caller may read, and the level is the compact
# fact a reader scanning the tree needs.
fragment TreeNode on PageTreeNode {
  id
  title
  icon
  slug
  sortOrder
  hasRestrictions
  labels
  marking {
    ...PageMarking
  }
}
