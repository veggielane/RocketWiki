# `Space.isReplica` + `originInstanceId` drive the proactive "Replica of
# {origin} — read-only" marking (design.md §12) on the space list,
# nav, space browser, and page view; replica-ness still also surfaces
# reactively on any write via the typed ReadOnlyReplica error.
# `viewerIsWatching` is the server truth behind the watch toggle. There is
# no per-space viewer-role field; `grants` is the server-computed admin
# signal — it returns rows only to instance/space admins ("absent, not
# forbidden") and a space always has at least one grant by construction
# (creation is atomic with its first grant), so a non-empty list means
# "this caller may manage the space".
query SpaceList {
  spaces {
    id
    key
    name
    description
    isReplica
    originInstanceId
  }
}

query SpaceTree($key: String!) {
  space(key: $key) {
    id
    key
    name
    description
    homepageId
    isReplica
    originInstanceId
    viewerIsWatching
    # The server's own answer to "may this caller manage the space", replacing a
    # proxy that inferred it from `grants` coming back non-empty. The proxy read
    # an EMPTY grant list as "not permitted" — which is what a permitted manager
    # sees on a space that simply has no grants, so it locked them out of
    # controls the server would have accepted.
    canManageAccess
    # Accountability metadata (design.md §6.5), NOT access. Nullable, and null is
    # a real state: an imported replica starts ownerless until somebody on the
    # high side takes responsibility for it.
    owner {
      id
      displayName
      hasAvatar
    }
    grants {
      id
    }
  }
}

# The page view's replica banner: the page read carries only spaceKey, so
# the space's replica flag is a second small lookup by key.
query SpaceReplicaBanner($key: String!) {
  space(key: $key) {
    id
    key
    isReplica
    originInstanceId
  }
}

# The server builds the tree to full depth; this document is what truncates it,
# so the depth here is a payload decision rather than a server cost.
#
# THREE levels, not eight, now that `hasChildren` and `pageSubtree` exist. A
# GraphQL document has to pick a depth, so a tree query always truncates
# somewhere — and the previous fix (going deeper) only moved the boundary to
# where the bug would be rarer and therefore harder to notice. Shallow on
# purpose: it keeps the first payload small, and it makes fetch-on-expand the
# ORDINARY path rather than one that only fires on unusually deep trees, which
# would be a code path nobody exercises until it is broken.
#
# `hasChildren` is what makes the truncation honest. The disclosure control is
# drawn from it rather than from whether children arrived, so the tree no longer
# claims a page is a leaf when the document simply stopped short of it.
query SpacePageTree($spaceId: UUID!) {
  pageTree(spaceId: $spaceId) {
    ...TreeNode
    children {
      ...TreeNode
      children {
        ...TreeNode
      }
    }
  }
}

# The children of one node, fetched when it is expanded and the query above did
# not reach them. Same pruned walk on the server, so a subtree inherits the same
# grants, restrictions and clearance gate the first fetch did.
query PageSubtree($spaceId: UUID!, $pageId: UUID!) {
  pageSubtree(spaceId: $spaceId, pageId: $pageId) {
    ...TreeNode
    children {
      ...TreeNode
      children {
        ...TreeNode
      }
    }
  }
}

# `hasRestrictions` feeds the tree's lock badge (design.md §6.6);
# `labels` feeds the space browser's label-filter facet. Both are
# permission-filtered server-side like the tree itself.
#
# `icon` is the page's own glyph in the tree (nullable — no icon is the
# ordinary case, and the tree falls back to its generic page glyph). Selected
# on the node rather than read per page: the drawer renders the whole tree at
# once, and a lookup per row would be a query per row.
#
# `marking` is the value the tree's own pruning walk gated on (design.md
# §21.9 — GetPageTreeAsync loads every marking for the space anyway, and a
# node that displayed a marking other than the one that decided it was
# visible would be the wrong kind of wrong). The tree shows the LEVEL only:
# §21.5 prunes an over-classified node together with its whole subtree, so
# what remains is what this caller may read, and the level is the compact
# fact a reader scanning the tree needs.
fragment TreeNode on PageTreeNode {
  id
  title
  icon
  slug
  hasChildren
  sortOrder
  hasRestrictions
  labels
  marking {
    ...PageMarking
  }
}
