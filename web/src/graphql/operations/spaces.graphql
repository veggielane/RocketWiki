# `Space.isReplica` + `originInstanceId` drive the proactive "Replica of
# {origin} — read-only" marking (design.md §12) on the space list,
# nav, space browser, and page view; replica-ness still also surfaces
# reactively on any write via the typed ReadOnlyReplica error.
# `viewerIsWatching` is the server truth behind the watch toggle.
#
# `viewerHasAccess` (§6.4): whether the caller holds an ACCESS grant here —
# the thing that lets them read pages. A space is listed when the caller
# matches an access grant OR any role grant, so a space admin with no access
# grant sees the space in this list with `viewerHasAccess: false`; its tree
# then comes back empty and every page in it reads as protected. The rail
# and the browser use the flag to say so rather than "No pages yet".
query SpaceList {
  spaces {
    id
    key
    name
    description
    isReplica
    originInstanceId
    viewerHasAccess
  }
}

query SpaceTree($key: String!) {
  space(key: $key) {
    id
    key
    name
    description
    homepageId
    isReplica
    originInstanceId
    viewerIsWatching
    # The server's own answer to "may this caller manage the space" (space-admin
    # role grant, or instance admin). It needs no access grant: managing a
    # space you cannot read is a normal state now that access and role are
    # separate kinds of grant (§6.4), which is why the old `grants`-non-empty
    # proxy is gone — it read an empty grant list as "not permitted", and it
    # would now also read "may see the grants" as "may see the pages".
    canManageAccess
    # See SpaceList. On the settings screen this is what warns a manager that
    # they hold no access grant of their own.
    viewerHasAccess
    # Accountability metadata (design.md §6.5), NOT access. Nullable, and null is
    # a real state: an imported replica starts ownerless until somebody on the
    # high side takes responsibility for it.
    owner {
      id
      displayName
      hasAvatar
    }
  }
}

# The page view's replica banner: the page read carries only spaceKey, so
# the space's replica flag is a second small lookup by key.
query SpaceReplicaBanner($key: String!) {
  space(key: $key) {
    id
    key
    isReplica
    originInstanceId
  }
}

# The server builds the tree to full depth; this document is what truncates it,
# so the depth here is a payload decision rather than a server cost.
#
# THREE levels, not eight, now that `hasChildren` and `pageSubtree` exist. A
# GraphQL document has to pick a depth, so a tree query always truncates
# somewhere — and the previous fix (going deeper) only moved the boundary to
# where the bug would be rarer and therefore harder to notice. Shallow on
# purpose: it keeps the first payload small, and it makes fetch-on-expand the
# ORDINARY path rather than one that only fires on unusually deep trees, which
# would be a code path nobody exercises until it is broken.
#
# `hasChildren` is what makes the truncation honest. The disclosure control is
# drawn from it rather than from whether children arrived, so the tree no longer
# claims a page is a leaf when the document simply stopped short of it.
#
# Every level is a `PageTreeEntry` UNION (design.md §6.7 / §21.8): a readable
# page is a `PageTreeNode`, a page this caller may not read is a
# `ProtectedTreeNode` — a leaf at its sibling position carrying only its
# denial (marking + failing gates), never an id, slug, icon, labels or
# children. `__typename` is selected explicitly so the SPA branches on the
# server's own discriminator rather than on which fields happened to arrive.
# `hasChildren` is true when only placeholders lie beneath, so a branch of
# nothing but protected leaves still draws its chevron.
query SpacePageTree($spaceId: UUID!) {
  pageTree(spaceId: $spaceId) {
    __typename
    ... on PageTreeNode {
      ...TreeNode
      children {
        __typename
        ... on PageTreeNode {
          ...TreeNode
          children {
            __typename
            ... on PageTreeNode {
              ...TreeNode
            }
            ... on ProtectedTreeNode {
              ...ProtectedTreeEntry
            }
          }
        }
        ... on ProtectedTreeNode {
          ...ProtectedTreeEntry
        }
      }
    }
    ... on ProtectedTreeNode {
      ...ProtectedTreeEntry
    }
  }
}

# The children of one node, fetched when it is expanded and the query above did
# not reach them. Same walk on the server, so a subtree inherits the same
# grants, restrictions and marking gates the first fetch did — and the same
# placeholders. Asking for the subtree of a placeholder answers `[]`.
query PageSubtree($spaceId: UUID!, $pageId: UUID!) {
  pageSubtree(spaceId: $spaceId, pageId: $pageId) {
    __typename
    ... on PageTreeNode {
      ...TreeNode
      children {
        __typename
        ... on PageTreeNode {
          ...TreeNode
          children {
            __typename
            ... on PageTreeNode {
              ...TreeNode
            }
            ... on ProtectedTreeNode {
              ...ProtectedTreeEntry
            }
          }
        }
        ... on ProtectedTreeNode {
          ...ProtectedTreeEntry
        }
      }
    }
    ... on ProtectedTreeNode {
      ...ProtectedTreeEntry
    }
  }
}

# `hasRestrictions` feeds the tree's lock badge (design.md §6.6);
# `labels` feeds the space browser's label-filter facet. Both are
# permission-filtered server-side like the tree itself.
#
# `icon` is the page's own glyph in the tree (nullable — no icon is the
# ordinary case, and the tree falls back to its generic page glyph). Selected
# on the node rather than read per page: the drawer renders the whole tree at
# once, and a lookup per row would be a query per row.
#
# `marking` is the value the tree's own gate walk decided on (design.md
# §21.9 — GetPageTreeAsync loads every marking for the space anyway, and a
# node that displayed a marking other than the one that decided it was
# visible would be the wrong kind of wrong). A readable node shows the LEVEL
# only: what remains readable is what this caller may read, and the level is
# the compact fact a reader scanning the tree needs.
fragment TreeNode on PageTreeNode {
  id
  title
  icon
  slug
  hasChildren
  sortOrder
  hasRestrictions
  labels
  marking {
    ...PageMarking
  }
}

# A page this caller may not read, at its place in the tree. `title` is the
# server's placeholder constant, rendered verbatim; `denial` says why, with
# the page's whole marking label when the caller holds access to the space
# and nothing but the space sentence when they do not.
fragment ProtectedTreeEntry on ProtectedTreeNode {
  title
  sortOrder
  denial {
    ...AccessDenial
  }
}
