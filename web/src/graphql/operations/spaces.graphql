# NOTE (schema reconciliation): the real Space exposes `isReplicaOf(
# localInstanceId: String!)` — an argument the browser has no way to supply
# (the local instance id is only served by the admin-only syncStatus query),
# so the client cannot mark replica spaces proactively; reported as a
# contract gap (design.md §12 wants a "mirrored from LOW — read-only"
# banner). Replica-ness still surfaces reactively via every write's typed
# ReadOnlyReplica error. There is also no per-space viewer-role field;
# `grants` is the server-computed admin signal — it returns rows only to
# instance/space admins ("absent, not forbidden") and a space always has at
# least one grant by construction (creation is atomic with its first
# grant), so a non-empty list means "this caller may manage the space".
query SpaceList {
  spaces {
    id
    key
    name
    description
  }
}

query SpaceTree($key: String!) {
  space(key: $key) {
    id
    key
    name
    description
    homepageId
    grants {
      id
    }
  }
}

query SpacePageTree($spaceId: UUID!) {
  pageTree(spaceId: $spaceId) {
    ...TreeNode
    children {
      ...TreeNode
      children {
        ...TreeNode
        children {
          ...TreeNode
        }
      }
    }
  }
}

fragment TreeNode on PageTreeNode {
  id
  title
  slug
  sortOrder
}
