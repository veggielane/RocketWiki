# design.md §21: every page carries a protective marking — a UK Government
# classification, optional selectors (§21.15), an optional eyes-only national
# caveat, and a presentational UK prefix — and all but the prefix GATE READ
# ACCESS. This is an access control the SPA renders, not a decoration it draws.
#
# `label` is the whole reason this fragment asks for the display strings
# instead of composing them: §21.4/§21.12 put the ONE formatter server-side
# (`ProtectiveMarking.FormatLabel`) so the SPA, an MCP client and an audit
# reviewer read identical text — "two renderings of one marking that disagree
# is a compliance problem, not a cosmetic one".
#
# `label` and `levelName` are NOT interchangeable and the difference is not
# cosmetic: `label` is the WHOLE marking, `levelName` is only its level
# (§21.1's display spelling — `OFFICIAL-SENSITIVE`, not the `OFFICIAL_SENSITIVE`
# wire name). Rendering `levelName` where a marking is claimed silently drops
# the selectors and the caveat, so a page released only to NZ nationals would
# read as plain SECRET. The rule this fragment exists to keep: **anything
# presenting "this page's marking" renders `label`; `levelName` is only for
# surfaces with no room for one** — a one-word list badge.
#
# `level`/`eyesOnly`/`selectors`/`ukPrefix` are the machine values
# `setPageMarking` replaces, never display. `eyesOnly` is a list of strings on
# OUTPUT (a legacy token stored before the vocabulary was fixed must never
# break serialisation) but an enum on INPUT — the control pins its picker to
# that enum (markings/caveatCountries.ts) and cannot send anything else.
fragment PageMarking on PageMarkingView {
  level
  levelName
  eyesOnly
  selectors {
    category
    value
  }
  ukPrefix
  label
}

# §21.13: a search result list and an Ask answer are COMPILATIONS, and a
# compilation carries the classification of its most sensitive constituent.
# This is a display label and nothing else — never stored, gating nothing
# (enforcement already happened per source, before the aggregate existed), and
# nullable, because "nothing fed this" has no honest marking: not OFFICIAL,
# which would assert a judgement about content that does not exist, and not
# TOP SECRET, which would invent a fact.
#
# `label` and `level`, and the omissions are the point. The caveat sets and
# selectors are the PARTS, and an aggregate's caveat is a truthful CONJUNCTION
# the per-page model cannot express — `UK SECRET UK EYES ONLY, US EYES ONLY`,
# meaning a reader needs both, because a union would widen and an intersection
# can reach empty (which in this model reads as "no caveat at all"). Composing
# that client-side would be a second formatter reimplementing the harder half
# of the one server-side formatter; not selecting the parts is how the SPA
# stays unable to try. `level` is styling only (markingTone).
fragment AggregateMarking on AggregateMarkingLabel {
  level
  label
}

# The picker's vocabulary (§21.1). A picker holds no marking, so it cannot use
# `levelName` — it has to offer all four levels before one is chosen, and
# hard-coding their spellings here would put a second implementation of the
# display form in TypeScript, which is exactly what §21.1's "one method each"
# forbids. Returned in SCHEME ORDER, least sensitive first, so the control
# renders the list as given and never encodes that OFFICIAL sorts below SECRET.
query ClassificationScheme {
  classificationScheme {
    level
    name
  }
}

# §21.6: one mutation replaces the whole marking — level, selectors, caveat
# and prefix together — because a marking is one value and a partial update
# would let a caller change the level without ever stating what caveat they
# meant. Every part is sent explicitly on every call; the input has no
# defaults, so there is nothing an omission could silently re-assert.
#
# Refusals that reach here despite the control trying to make them unreachable
# (markings/clearance.ts): a level above the caller's own clearance, a
# selector they are not eligible for or not granted in this space, and a
# resulting marking they could not then read — all Forbidden (§21.6). They are
# still surfaced rather than swallowed: a clearance or a grant can change
# mid-session, and the server is the authority either way. Two values in one
# category, or a value the instance does not configure, is a Validation error
# the control cannot produce.
mutation SetPageMarking($input: SetPageMarkingRequestInput!) {
  setPageMarking(input: $input) {
    marking {
      ...PageMarking
    }
    error {
      ...MutationError
    }
  }
}
