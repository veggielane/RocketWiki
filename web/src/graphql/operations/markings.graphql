# design.md §21: every page carries a protective marking — a UK Government
# classification, an optional eyes-only country set, and an optional national
# prefix — and the first two GATE READ ACCESS. This is an access control the
# SPA renders, not a decoration it draws.
#
# `label` is the whole reason this fragment asks for the display strings
# instead of composing them: §21.4/§21.12 put the ONE formatter server-side
# (`ProtectiveMarking.Format`) so the SPA, an MCP client and an audit reviewer
# read identical text — "two renderings of one marking that disagree is a
# compliance problem, not a cosmetic one".
#
# `label` and `levelName` are NOT interchangeable and the difference is not
# cosmetic: `label` is the WHOLE marking, `levelName` is only its level
# (§21.1's display spelling — `OFFICIAL-SENSITIVE`, not the `OFFICIAL_SENSITIVE`
# wire name). Rendering `levelName` where a marking is claimed silently drops
# the caveat, so a page released only to GB nationals would read as plain
# SECRET. The rule this fragment exists to keep: **anything presenting "this
# page's marking" renders `label`; `levelName` is only for surfaces with no
# room for one** — a one-word list badge. `level`/`eyesOnly`/`prefix` are the
# machine values `setPageMarking` replaces, never display.
fragment PageMarking on PageMarkingView {
  level
  levelName
  eyesOnly
  prefix
  label
}

# §21.13: a search result list and an Ask answer are COMPILATIONS, and a
# compilation carries the classification of its most sensitive constituent.
# This is a display label and nothing else — never stored, gating nothing
# (enforcement already happened per source, before the aggregate existed), and
# nullable, because "nothing fed this" has no honest marking: not OFFICIAL,
# which would assert a judgement about content that does not exist, and not
# TOP SECRET, which would invent a fact.
#
# `label` and `level`, and the omissions are the point. `eyesOnlySets` and
# `prefix` are the PARTS, and an aggregate's caveat is a truthful CONJUNCTION
# the per-page model cannot express — `UK SECRET [GB EYES ONLY] [US EYES ONLY]`,
# meaning a reader needs both, because a union would widen and an intersection
# can reach empty (which in this model reads as "no caveat at all"). Composing
# that client-side would be a second formatter reimplementing the harder half
# of the one server-side formatter; not selecting the parts is how the SPA
# stays unable to try. `level` is styling only (markingTone).
fragment AggregateMarking on AggregateMarkingLabel {
  level
  label
}

# The picker's vocabulary (§21.1). A picker holds no marking, so it cannot use
# `levelName` — it has to offer all four levels before one is chosen, and
# hard-coding their spellings here would put a second implementation of the
# display form in TypeScript, which is exactly what §21.1's "one method each"
# forbids. Returned in SCHEME ORDER, least sensitive first, so the control
# renders the list as given and never encodes that OFFICIAL sorts below SECRET.
query ClassificationScheme {
  classificationScheme {
    level
    name
  }
}

# §21.6: one mutation replaces the whole marking — level and country set
# together — because a marking is one value and a partial update would let a
# caller change the level without ever stating what caveat they meant. The
# prefix is sent explicitly on every call rather than omitted: omitting it
# takes the schema's `UK` default, which would silently re-assert a national
# qualifier on a page whose author cleared it (§21.12 — null/empty is legal
# and must stay clearable).
#
# Two refusals reach here that the control tries to make unreachable
# (markings/clearance.ts): a level above the caller's own clearance and a
# resulting marking the caller could not then read, both ForbiddenError
# (§21.6). They are still surfaced rather than swallowed — a clearance can
# change mid-session, and the server is the authority either way.
mutation SetPageMarking($input: SetPageMarkingRequestInput!) {
  setPageMarking(input: $input) {
    marking {
      ...PageMarking
    }
    error {
      ...MutationError
    }
  }
}
