# "Ask the wiki" (design.md §9.5): permission-filtered RAG under the
# caller's own principal — retrieval only ever sees pages the asker can
# view, so neither can the model. Every designed failure mode is a payload
# fact (`unavailable`), never a GraphQL error (§18 degradation pattern):
# NOT_CONFIGURED (feature absent on this instance — no chat endpoint),
# UNREACHABLE (endpoint down; one attempt, bounded timeout), NO_RESULTS
# (nothing viewable answers this — the model was never called).
#
# `answer` carries inline `[Sn]` markers (1-based, in order of first
# appearance) that index into `citations`; each citation's
# pageId + anchorId deep-links exactly like a search hit
# (`/pages/{id}#{anchorId}` — same §9.2 chunker anchors).
# design.md §21.13 adds the two marking selections below, and they are
# different things. `citations[].marking` is each SOURCE PAGE's own marking —
# the reader scanning citations needs to see which source is the sensitive
# one. `aggregateMarking` is what the ANSWER is: the highest classification
# among everything that entered the model's context, which is deliberately
# wider than the citations — retrieved content that shaped the answer without
# earning a citation shaped it anyway, and a marking a model could defeat by
# declining to cite would not be a marking. So the aggregate can legitimately
# out-rank every citation badge on screen.
#
# It is nullable: no sources means no label, and the SPA renders nothing
# rather than substituting one.
query AskWiki($question: String!) {
  askWiki(question: $question) {
    answer
    citations {
      pageId
      title
      headingPath
      anchorId
      marking {
        ...PageMarking
      }
    }
    unavailable
    aggregateMarking {
      ...AggregateMarking
    }
  }
}

# The assistant's shape, asked BEFORE a question is sent — which is the whole
# point of it being a status query rather than a field on `AskWikiPayload`. The
# payload arrives with an answer, i.e. after the ask that a length warning
# exists to prevent; a bound nobody can read until they have already hit it is
# not a bound anyone can act on.
#
# `maxQuestionChars` is nullable: null when the assistant is unconfigured, which
# is the honest shape rather than a zero or a sentinel — there is no feature, so
# there is no bound. Anonymous callers get the same absent shape.
query AssistantStatus {
  assistantStatus {
    configured
    maxQuestionChars
  }
}
