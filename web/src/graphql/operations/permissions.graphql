# design.md §6.6: the restrictions listing and the shipped permission
# inspector.
#
# `Page.restrictions` is manage-gated server-side and lists own + inherited
# rules, flagged, with the source page's title — so an admin editing this
# page's rules can see the whole accumulated chain (§6.4) and never stacks
# a second restriction believing they were replacing an inherited one.
#
# `effectivePermission` is a ROOT query, not a Page field — a deliberate
# divergence from §8's sketch so the non-admin refusal of a foreign
# `subject` happens before any page lookup. Self-inspection (no subject)
# works for anyone who can view the page; a principal-shaped `subject` is
# the instance-admin-only foreign/what-if mode. Restriction checks carry
# `expressionJson`, parsed client-side with the same ruleSerializer the
# builder uses.
query PagePermissions($id: UUID!) {
  page(id: $id) {
    id
    title
    spaceKey
    canManageAccess
    restrictions {
      ruleId
      pageId
      pageTitle
      inherited
      action
      expressionJson
      createdAtUtc
      updatedAtUtc
      updatedByDisplayName
    }
  }
}

# `hasSpaceAccess` and `spaceRole` are the two halves §6.4 split apart: the
# first is whether an ACCESS grant matched (may see), the second the highest
# ROLE grant that matched (may edit / administer) — or null, since no role
# is the ordinary state for a reader. `viewGates` and `editGates` are the
# whole ladder (space access, classification, selector eligibility, selector
# grant, national caveat, restriction; then replica and role for editing),
# every gate evaluated with pass/fail rather than stopping at the first
# failure — the inspector's job is to explain, and the enforcement path's
# short-circuit is exactly what it must not inherit. The gate rows carry no
# level or country detail here (the page's own `marking` sits beside them);
# `viewDenialReason`/`editDenialReason` stay as the audit's first-failing
# token.
query EffectivePermission($pageId: UUID!, $subject: InspectedPrincipalInput) {
  effectivePermission(pageId: $pageId, subject: $subject) {
    userId
    userDisplayName
    hasSpaceAccess
    spaceRole
    isReplicaSpace
    canView
    canEdit
    viewDenialReason
    editDenialReason
    viewGates {
      ...GateCheck
    }
    editGates {
      ...GateCheck
    }
    viewRestrictions {
      ruleId
      pageId
      pageTitle
      action
      expressionJson
      passed
    }
    editRestrictions {
      ruleId
      pageId
      pageTitle
      action
      expressionJson
      passed
    }
  }
}

# design.md §6.6: picker vocabulary for the rule builder — known groups
# accumulated from observed logins, plus the attribute registry (§6.2).
# Gated to rule managers server-side and enumerated honestly from local
# data; suggestion vocabulary, never authority (the group picker stays
# freeSolo), so a query error or empty result just means typing by hand.
query RuleVocabulary {
  groups
  attributeRegistry {
    key
    displayName
    allowedValues
  }
}

# The same accumulated group vocabulary as `RuleVocabulary` above, on its own
# for the admin Groups screen — which wants only the names and should not pull
# the attribute registry with them. Groups are NOT stored per user: this is the
# set of names the instance has observed in tokens at sign-in, which is why the
# screen can list them and can never show who is in one.
query KnownGroups {
  groups
}
