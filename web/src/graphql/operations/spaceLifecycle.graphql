# design.md §6.5.1: space creation is atomic with its first grants — the
# real mutation takes `initialGrants` as a separate required list, and the
# server refuses a list without at least one ROLE_GRANT of SPACE_ADMIN, so a
# space is born administrable and the API can never substitute a default.
# Access grants are optional in that list: by default nobody can see a new
# space until one says otherwise (§6.4), which is the user's rule and the
# reason the form never pre-fills "everyone".
#
# A duplicate key comes back as the flattened error with kind
# "Validation" (there is no dedicated keyAlreadyInUse error type).
mutation CreateSpace($input: CreateSpaceRequestInput!, $initialGrants: [InitialGrantInput!]!) {
  createSpace(input: $input, initialGrants: $initialGrants) {
    space {
      id
      key
      name
    }
    error {
      ...MutationError
    }
  }
}

mutation RenameSpace($input: RenameSpaceRequestInput!) {
  renameSpace(input: $input) {
    space {
      id
      key
      name
      description
    }
    error {
      ...MutationError
    }
  }
}

mutation ArchiveSpace($input: ArchiveSpaceRequestInput!) {
  archiveSpace(input: $input) {
    space {
      id
      key
      isDeleted
    }
    error {
      ...MutationError
    }
  }
}

# design.md §6.5.1: `archivedSpaces` is scoped server-side to exactly who
# `restoreSpace` accepts (instance admin, or that space's own
# space-admin), so every row it returns is restorable by the caller — an
# empty list means "nothing archived that you could restore", not
# "nothing archived".
query ArchivedSpaces {
  archivedSpaces {
    id
    key
    name
    archivedAtUtc
  }
}

mutation RestoreSpace($input: RestoreSpaceRequestInput!) {
  restoreSpace(input: $input) {
    space {
      id
      key
      isDeleted
    }
    error {
      ...MutationError
    }
  }
}

# The space's default page (design.md §12's "stays local" column). `pageId` is
# nullable because clearing has to stay expressible — no default page is the
# ordinary state, and a picker you can only ever set is a one-way door.
#
# Returns the space's own `homepageId` rather than the whole page: the settings
# screen already holds the tree it chose from, so re-reading the page would be a
# round trip for a title it can look up locally.
mutation SetSpaceHomepage($input: SetSpaceHomepageRequestInput!) {
  setSpaceHomepage(input: $input) {
    space {
      id
      homepageId
    }
    error {
      ...MutationError
    }
  }
}
