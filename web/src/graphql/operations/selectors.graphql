# design.md §21.15: additional selectors. A marking may carry at most one
# value per CATEGORY, and both the categories and their values are instance
# configuration (`ProtectiveMarking:SelectorCategories`) read here — the SPA
# hard-codes no category and no value, because the vocabulary is policy fixed
# per deployment and a picker that knew "FRUIT" would be wrong on the next
# instance.
#
# A category carries no attribute gate. Whether THIS caller may read a value
# is decided per space by the access grants they match (`viewerSelectorGrants`
# below) and nowhere else. Readable by any authenticated user and un-audited:
# it names vocabulary, not content.
query SelectorCategories {
  selectorCategories {
    name
    description
    values
  }
}

# The selector values the caller is GRANTED in one space — the union over
# every access grant they match (§6.4). This is the whole of the selector
# gate: every value the page carries must be among the values the caller's
# grants in that space confer. The marking control reads it so a value the
# caller could not then read is greyed out with its reason rather than
# offered and refused (the self-lockout rule, extended to selectors).
# Affordance data; the server still decides.
query SpaceSelectorGrants($key: String!) {
  space(key: $key) {
    id
    key
    viewerSelectorGrants {
      category
      value
    }
  }
}
