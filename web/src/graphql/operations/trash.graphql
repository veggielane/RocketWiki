# design.md §6.4.1: a cascade delete trashes a whole subtree as one batch.
# The real schema exposes trashed PAGES (each carrying its deleteBatchId),
# not batch rows — the client groups them back into batches
# (trash/groupTrashBatches.ts) and restores via the batch's root page id
# (restorePage restores the whole batch, per PageRestoreSummary).
mutation DeletePage($input: DeletePageRequestInput!) {
  deletePage(input: $input) {
    summary {
      rootPageId
      deletedPageCount
      deletedAtUtc
    }
    error {
      ...MutationError
    }
  }
}

query SpaceTrash($key: String!) {
  space(key: $key) {
    id
    key
    name
    trashedPages {
      id
      title
      parentPageId
      ancestorPath
      deleteBatchId
      deletedAtUtc
      deletedByUserId
    }
  }
}

mutation RestorePage($input: RestorePageRequestInput!) {
  restorePage(input: $input) {
    summary {
      rootPageId
      restoredPageCount
    }
    error {
      ...MutationError
    }
  }
}
