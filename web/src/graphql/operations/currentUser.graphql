# `me` is claims-shaped (`id` is the token subject; `name`/`email` are
# nullable) plus two server-computed fields: `isInstanceAdmin` — the
# server's own InstanceRoleAccessor verdict, so the SPA no longer decodes
# the roles claim itself (auth/useIsInstanceAdmin.ts) — and `localUserId`,
# the local User row id that Comment.authorUserId etc. carry, for
# "is this row mine?" checks.
query CurrentUser {
  me {
    id
    email
    name
    groups
    isAuthenticated
    isInstanceAdmin
    localUserId
    hasAvatar
    # design.md §21: the caller's OWN nationality, canonicalised server-side
    # on the same path the caveat gate reads. It exists so the marking
    # control can PREVENT rather than refuse — an eyes-only set holding none
    # of these nationalities is a marking the caller could not then read,
    # which the server rejects and the UI therefore warns about before the
    # save. Affordance data, never a decision: the server enforces.
    #
    # No clearance and no selector eligibility, and that is the access model
    # rather than an omission: this deployment carries neither attribute, so
    # nothing compares a classification level against a person (any editor
    # may set any level) and a selector is gated by the per-space grants
    # alone (`Space.viewerSelectorGrants`).
    nationality
  }
}
