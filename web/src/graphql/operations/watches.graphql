# design.md §8: watching is canView-gated server-side; unwatching is
# deliberately ungated (a user who lost access must still be able to
# unwatch). NOTE (schema reconciliation, reported): there is no read path
# for "am I watching this page/space?" — the watch buttons keep local
# toggle state per visit and cannot show the true initial state.
mutation WatchPage($input: WatchPageRequestInput!) {
  watchPage(input: $input) {
    watch {
      id
      pageId
    }
    error {
      ...MutationError
    }
  }
}

mutation UnwatchPage($input: UnwatchPageRequestInput!) {
  unwatchPage(input: $input) {
    watch {
      id
    }
    error {
      ...MutationError
    }
  }
}

mutation WatchSpace($input: WatchSpaceRequestInput!) {
  watchSpace(input: $input) {
    watch {
      id
      spaceId
    }
    error {
      ...MutationError
    }
  }
}

mutation UnwatchSpace($input: UnwatchSpaceRequestInput!) {
  unwatchSpace(input: $input) {
    watch {
      id
    }
    error {
      ...MutationError
    }
  }
}
