# TEMPORARY placeholder schema.
#
# The real `schema.graphql` is exported by RocketWiki.Api (Hot Chocolate,
# code-first — see design.md §8). As of this writing the backend's
# content/access resolvers (comments, labels, attachments, search, audit,
# trash) are being implemented against it, but the file itself doesn't
# exist in this frontend's tree yet. This hand-transcribed guess exists
# only so:
#   1. `codegen.ts` has something to point at and the codegen pipeline can
#      be proven to run end-to-end now, instead of first being exercised
#      once the real schema lands.
#   2. Frontend routes/components have a typed shape to build against.
#
# TO RECONCILE, once the real `schema.graphql` exists (likely at the repo
# root, alongside data-model.md):
#   1. In codegen.ts, change `schema:` from this file's path to the real
#      one, then run `npm run codegen`.
#   2. Run `npm run build`. Every field-name or shape mismatch surfaces as
#      a TypeScript compile error at its exact call site — that's the
#      mechanical part, not something to hunt for by reading diffs.
#   3. Delete this file once nothing references it.
#
# Confidence varies a lot across what's below — some of it mirrors an
# already-implemented backend contract exactly, most of it is a bare
# guess:
#   - HIGH confidence (mirrors a canonical backend source file 1:1, not
#     independently re-derived): the rule-expression JSON shape
#     (RuleNode/AllOf/AnyOf/Group/User/Attr — matches
#     RocketWiki.Core.Access.RuleExpressionSerializer exactly, see
#     web/src/access/ruleSerializer.ts) and the heading-anchor algorithm
#     (SearchHit.anchorId — see web/src/editor/headingAnchors.ts and the
#     checked-in corpus at tests/fixtures/heading-anchors/).
#   - MEDIUM confidence: everything shaped directly off a design.md
#     section with a documented invariant to satisfy — canManageAccess's
#     "instance admin OR that resource's space-admin" union (§6.5),
#     blockedDescendantCount's "count only, never identities" (§6.4.1/§6.7),
#     EffectivePermissionDetail's per-restriction breakdown (§6.6, and note
#     the doc comment on that type: it requires a NON-short-circuiting
#     sibling to EffectivePermissionCalculator.CheckRestrictions that
#     doesn't exist yet).
#   - LOW confidence / VERY PROVISIONAL, expect real divergence: Notification,
#     ImportReport/ImportFinding (the importer producing these is also
#     still being built), AuditEvent's exact field set, and every SignalR
#     hub method/event name in web/src/realtime/ (Notification,
#     JoinPage/LeavePage/PointerMove/ViewersChanged/PointerMoved) — those
#     aren't even in this GraphQL file, they're this frontend's proposal
#     for a hub that doesn't exist.
#
# Every type below should still be treated as a guess, not a contract — do
# not let backend work conform to this file; conform this file to the
# backend once it exists.

type Query {
  me: CurrentUser!
  spaces: [Space!]!
  space(key: String!): Space
  page(id: ID!): Page
  search(query: String!, spaceKey: String, labels: [String!], after: String): SearchConnection!
  groups: [String!]!
  attributeRegistry: [AttributeDefinition!]!
  auditEvents(filter: AuditFilter!, after: String): AuditEventConnection! # admin
  labels(spaceKey: String): [String!]! # known labels, for the search facet and label-filter UI
  # design.md §13: RocketWiki.Importer emits a per-page lossy-conversion
  # report; this just reads whatever it produced. VERY PROVISIONAL — the
  # importer is being built by another agent right now, so this shape is a
  # placeholder guess at a placeholder guess. Expect it to change more than
  # anything else in this file.
  importReports(spaceKey: String!): [ImportReport!]!
  # design.md §8, milestone 4b: persisted notification rows, so an offline
  # user catches up on load — SignalR (no hub yet) delivers the live nudge
  # on top of this. See web/src/realtime/types.ts's NotificationPayload
  # for why `pageTitle` is nullable (per-recipient canView at send time).
  notifications: [Notification!]!
  archivedSpaces: [Space!]! # design.md §6.5.1 — restore lives here, separate from the active `spaces` list
}

type Mutation {
  # design.md §6.5.1: space creation is atomic with its first grant — there
  # is no window where a space exists with zero access rules (a space
  # admin-less like that would be permanently unadministerable, since
  # granting access itself requires being that space's admin already).
  # `initialGrant` is required with no default: the mutation cannot
  # succeed without one, and the API must not silently substitute
  # `{ everyone: true }` — that's exactly the footgun this exists to
  # prevent.
  createSpace(input: CreateSpaceInput!): CreateSpacePayload!
  renameSpace(input: RenameSpaceInput!): RenameSpacePayload!
  archiveSpace(input: ArchiveSpaceInput!): ArchiveSpacePayload!
  restoreSpace(input: RestoreSpaceInput!): RestoreSpacePayload!
  createPage(input: CreatePageInput!): CreatePagePayload!
  updatePage(input: UpdatePageInput!): UpdatePagePayload!
  movePage(input: MovePageInput!): MovePagePayload!
  deletePage(input: DeletePageInput!): DeletePagePayload!
  addComment(input: AddCommentInput!): AddCommentPayload!
  deleteComment(input: DeleteCommentInput!): DeleteCommentPayload!
  restoreTrashBatch(input: RestoreTrashBatchInput!): RestoreTrashBatchPayload!
  markNotificationRead(input: MarkNotificationReadInput!): MarkNotificationReadPayload!
  setLabels(input: SetLabelsInput!): SetLabelsPayload!
  setPageRestrictions(input: SetPageRestrictionsInput!): SetPageRestrictionsPayload!
  setSpaceGrants(input: SetSpaceGrantsInput!): SetSpaceGrantsPayload!
}

type CurrentUser {
  id: ID!
  displayName: String!
  email: String!
  isInstanceAdmin: Boolean!
}

type Space {
  key: String!
  name: String!
  description: String
  homepage: Page
  tree: [PageTreeNode!]!
  isReplica: Boolean!
  originInstanceId: String
  # Server-computed: true iff the caller is this space's space-admin OR the
  # instance admin (a union of both checks, so the client only needs to
  # read one field rather than re-deriving the OR itself — design.md §6.5:
  # admins can edit rules, but every change is audited).
  canManageAccess: Boolean!
  grants: [SpaceGrant!]! # space-admin only, per design.md §8's schema sketch
  labels: [String!]! # every distinct label used in this space, for the filter facet + add-label autocomplete
  # design.md §6.4.1: a cascade delete trashes a whole subtree as one
  # operation — one batch per delete, not one row per page, so restoring
  # brings the subtree back together rather than requiring N restores.
  trash: [TrashBatch!]!
  # design.md §6.5.1: rename/archive/restore all require canManageAccess
  # (instance admin OR this space's space-admin) — same field, same union,
  # no separate permission check to invent.
  isArchived: Boolean!
  archivedAtUtc: String
}

# One cascade-delete operation, covering every page in the deleted subtree.
type TrashBatch {
  id: ID!
  rootPageId: ID!
  rootPageTitle: String!
  pageCount: Int!
  deletedAtUtc: String!
  deletedByDisplayName: String!
  # 30-day trash window (data-model.md) — computed server-side as
  # deletedAtUtc + 30d so the client never has to reproduce that policy.
  expiresAtUtc: String!
}

type SpaceGrant {
  id: ID!
  role: String! # "viewer" | "editor" | "spaceAdmin"
  expressionJson: String!
}

type PageTreeNode {
  id: ID!
  title: String!
  slug: String!
  labels: [String!]! # client-side label filtering walks the already-fetched tree rather than a separate query
  children: [PageTreeNode!]!
  # This node's OWN restriction rules only (not inherited from ancestors) —
  # the move dialog walks root-to-target accumulating these to know what a
  # move would newly apply/remove (design.md §6.4, access/move/visibilityChange.ts).
  ownViewRestriction: OwnRestriction
  ownEditRestriction: OwnRestriction
}

type OwnRestriction {
  ruleId: ID!
  expressionJson: String!
}

type Page {
  id: ID!
  spaceKey: String!
  title: String!
  slug: String!
  content: String!
  revisionNumber: Int!
  parent: Page
  children: [Page!]!
  labels: [String!]!
  restrictions: PageRestrictions!
  canEdit: Boolean!
  canComment: Boolean!
  # Server-computed union: instance admin OR space-admin of this page's
  # space. Gates the permissions route client-side (design.md §6.7:
  # "absent rather than forbidden" — see NotFoundPage.tsx).
  canManageAccess: Boolean!
  # Diagnostic-only: the inspector's per-restriction breakdown needs every
  # restriction evaluated, not just the first failure
  # (EffectivePermissionCalculator.CheckRestrictions short-circuits — see
  # access/permission/effectivePermissionTypes.ts for why this resolver
  # would need its own non-short-circuiting evaluation path).
  effectivePermissionDetail(userId: ID!): EffectivePermissionDetail!
  # Flat list — the client builds the reply tree from `parentCommentId`
  # (access/comments/buildCommentTree.ts) rather than the server nesting it,
  # since a flat list is simpler to keep consistent after an add/delete
  # without refetching the whole tree.
  comments: [Comment!]!
  attachments: [Attachment!]!
}

type Comment {
  id: ID!
  pageId: ID!
  parentCommentId: ID
  # Blanked (empty string) when isDeleted — the row survives as a tombstone
  # so replies keep their parent (data-model.md: "IsDeleted bit — tombstone
  # — keeps thread shape, body blanked").
  body: String!
  isDeleted: Boolean!
  authorUserId: ID!
  authorDisplayName: String!
  createdAtUtc: String!
  editedAtUtc: String
}

type Attachment {
  id: ID!
  fileName: String!
  contentType: String!
  sizeBytes: Int!
  uploadedByDisplayName: String!
  createdAtUtc: String!
}

type PageRestrictions {
  hasViewRestriction: Boolean!
  hasEditRestriction: Boolean!
  summary: [String!]!
  # The page's OWN restriction rules (not inherited ones), as
  # RuleExpressionSerializer-shaped JSON strings — null when no restriction
  # of that kind is set on this page directly.
  viewExpressionJson: String
  editExpressionJson: String
}

type EffectivePermissionDetail {
  userId: ID!
  userDisplayName: String!
  spaceRole: String # "viewer" | "editor" | "spaceAdmin" | null — no grant matched
  isReplicaSpace: Boolean!
  canView: Boolean!
  canEdit: Boolean!
  viewDenialReason: String
  editDenialReason: String
  viewRestrictions: [RestrictionCheck!]!
  editRestrictions: [RestrictionCheck!]!
}

type RestrictionCheck {
  ruleId: ID!
  pageId: ID!
  pageTitle: String!
  action: String! # "view" | "edit"
  expressionJson: String!
  passed: Boolean!
}

type AttributeDefinition {
  key: String!
  displayName: String
  claimName: String!
  type: String!
  allowedValues: [String!]!
}

type SearchConnection {
  totalCount: Int!
  edges: [SearchEdge!]!
  pageInfo: PageInfo!
}

type SearchEdge {
  cursor: String!
  node: SearchHit!
}

type SearchHit {
  page: Page!
  snippet: String!
  headingPath: [String!]!
  # Deep-link target for this hit's matching section — `page/{id}#{anchorId}`.
  # CONTRACT: must be produced by the exact algorithm in
  # web/src/editor/headingAnchors.ts (computeHeadingAnchors), run over the
  # SAME page's full heading list in document order, so it matches the id
  # the frontend assigns when actually rendering that page. The frontend
  # defines this contract (there's no backend yet to author it against) —
  # whoever implements the real resolver should port that file's algorithm
  # exactly, not re-derive an equivalent one; two independently-written
  # slugifiers WILL disagree on edge cases (punctuation, disambiguation
  # ordinals) and silently break every deep link.
  anchorId: String!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

input CreateSpaceInput {
  key: String!
  name: String!
  description: String
  # Required, no default (design.md §6.5.1) — see the Mutation.createSpace comment.
  initialGrant: SpaceGrantInput!
}

input RenameSpaceInput {
  spaceKey: String!
  newName: String!
}

input ArchiveSpaceInput {
  spaceKey: String!
}

input RestoreSpaceInput {
  spaceKey: String!
}

input CreatePageInput {
  spaceKey: String!
  parentId: ID
  title: String!
  content: String!
}

input UpdatePageInput {
  pageId: ID!
  baseRevisionNumber: Int!
  title: String!
  content: String!
  editSummary: String
}

input MovePageInput {
  pageId: ID!
  newParentId: ID
}

input SetPageRestrictionsInput {
  pageId: ID!
  # RuleExpressionSerializer-shaped JSON strings, or null to remove the restriction.
  viewExpressionJson: String
  editExpressionJson: String
}

input SetSpaceGrantsInput {
  spaceKey: String!
  # Full replacement set (design.md §6.4: "multiple grants OR together;
  # your role is the highest whose expression you satisfy") — not a diff,
  # matching how the rule builder always produces one complete tree.
  grants: [SpaceGrantInput!]!
}

input SpaceGrantInput {
  id: ID # null for a newly added grant
  role: String! # "viewer" | "editor" | "spaceAdmin"
  expressionJson: String!
}

input DeletePageInput {
  pageId: ID!
}

input RestoreTrashBatchInput {
  batchId: ID!
}

input MarkNotificationReadInput {
  notificationId: ID!
}

input AddCommentInput {
  pageId: ID!
  parentCommentId: ID
  body: String!
}

input DeleteCommentInput {
  commentId: ID!
}

input SetLabelsInput {
  pageId: ID!
  labels: [String!]!
}

type CreateSpacePayload {
  space: Space
  malformedRuleError: MalformedRuleError
  # A key already in use — distinct from a generic error since the create
  # form should highlight the field rather than show a toast.
  keyAlreadyInUseError: KeyAlreadyInUseError
}

type KeyAlreadyInUseError {
  message: String!
}

type RenameSpacePayload {
  space: Space
}

type ArchiveSpacePayload {
  space: Space
}

type RestoreSpacePayload {
  space: Space
}

type CreatePagePayload {
  page: Page
}

type UpdatePagePayload {
  page: Page
  staleRevisionError: StaleRevisionError
  readOnlyReplicaError: ReadOnlyReplicaError
}

type MovePagePayload {
  page: Page
  readOnlyReplicaError: ReadOnlyReplicaError
}

type DeletePagePayload {
  success: Boolean!
  # design.md §6.4.1 + §6.7: when part of the subtree can't be deleted (a
  # descendant the caller lacks rights over), the response reports only
  # HOW MANY pages were blocked — never which ones. Naming a blocked page
  # would confirm its existence and rough position in the tree to someone
  # who may have no right to know that (the same "absent, not forbidden"
  # rule that applies to reading). The UI must not invent identities for
  # these — see access/trash's blocked-delete messaging.
  blockedDescendantCount: Int
  trashBatchId: ID # set when success — lets the UI link straight to the new trash entry
  readOnlyReplicaError: ReadOnlyReplicaError
}

type AddCommentPayload {
  comment: Comment
  readOnlyReplicaError: ReadOnlyReplicaError
}

type DeleteCommentPayload {
  comment: Comment # returned with isDeleted: true, body blanked — the tombstone, not removed
  readOnlyReplicaError: ReadOnlyReplicaError
}

type SetLabelsPayload {
  page: Page
  readOnlyReplicaError: ReadOnlyReplicaError
}

type SetPageRestrictionsPayload {
  page: Page
  # A malformed ExpressionJson denies access rather than crashing (design.md
  # §6.3) — surfaced here as a typed payload error, not a raw GraphQL error,
  # consistent with StaleRevisionError/ReadOnlyReplicaError elsewhere.
  malformedRuleError: MalformedRuleError
}

type MalformedRuleError {
  message: String!
}

type SetSpaceGrantsPayload {
  space: Space
  malformedRuleError: MalformedRuleError
}

type RestoreTrashBatchPayload {
  restoredPageCount: Int!
  restoredRootPageId: ID
  readOnlyReplicaError: ReadOnlyReplicaError
}

type MarkNotificationReadPayload {
  notification: Notification
}

input AuditFilter {
  userId: ID
  action: String
  subjectType: String
  outcome: String # "success" | "denied" — denials are shown alongside successes, never hidden (design.md §7)
  fromUtc: String # ISO 8601
  toUtc: String
}

type AuditEventConnection {
  totalCount: Int!
  edges: [AuditEventEdge!]!
  pageInfo: PageInfo!
}

type AuditEventEdge {
  cursor: String!
  node: AuditEvent!
}

type AuditEvent {
  id: ID!
  timestampUtc: String!
  userId: ID!
  userDisplayName: String!
  action: String! # "page.view", "page.edit", "permission.change", "audit.view", … (design.md §7)
  subjectType: String! # "page" | "space" | "attachment" | "comment" | "rule"
  subjectId: ID
  subjectSpaceKey: String
  outcome: String! # "success" | "denied"
  channel: String! # "graphql" | "mcp" | "attachment"
  mcpClientName: String
  detailsJson: String
}

# See the "VERY PROVISIONAL" note on Query.importReports above.
type ImportReport {
  id: ID!
  spaceKey: String!
  importedAtUtc: String!
  pageCount: Int!
  findings: [ImportFinding!]!
}

type ImportFinding {
  pageId: ID
  pageTitle: String!
  severity: String! # "info" | "warning" | "error"
  message: String!
}

type Notification {
  id: ID!
  type: String! # "page_watched_changed" | "comment_reply" | "mention" | "sync_bundle_landed"
  pageId: ID!
  spaceKey: String!
  # Null whenever the recipient's canView doesn't hold at read time (design.md
  # §8) — absent, not forbidden, same rule as everywhere else. Never
  # backfilled from another query.
  pageTitle: String
  actorDisplayName: String!
  createdAtUtc: String!
  readAtUtc: String
}

type StaleRevisionError {
  message: String!
  currentRevisionNumber: Int!
  currentContent: String!
}

type ReadOnlyReplicaError {
  message: String!
  originInstanceId: String!
}
